{{- if .Values.orthanc.enabled }}
{{- /*
Orthanc configuration, split across TWO ConfigMaps mounted at TWO paths.

WHY THE SPLIT — this is not cosmetic.

Orthanc is started with a DIRECTORY as its configuration argument and reads
every *.json in it, merging them all as server configuration. Verified on a
running edge (Orthanc 1.12.x):

    Scanning folder "/etc/orthanc" for configuration files
    Reading the configuration from: "/etc/orthanc/orthanc.json"
    Reading the configuration from: "/etc/orthanc/deidentification-profile.json"
    Reading the configuration from: "/etc/orthanc/routing.json"

So the old layout had Orthanc ingesting our AET routing table and our
de-identification profile as SERVER SETTINGS. It happens to be harmless right
now because none of those top-level keys (AETMap, Defaults, Keep, Replace,
Force, DeidMode, RemovePrivateTags) collide with an Orthanc setting — but the
scan order is filesystem order, so a future key that does collide would
silently reconfigure the server, non-deterministically, with no error.

Here:
    /etc/orthanc/       ONLY orthanc.json + the Lua script. Orthanc's config.
    /etc/ais-edge/      routing.json + the de-identification profile. Read by
                        our Lua hook via AIS_ROUTING_FILE; never scanned by
                        Orthanc.
*/ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "edge.fullname" . }}-orthanc-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "edge.labels" . | nindent 4 }}
data:
  orthanc.json: |
    {
      "Name": {{ printf "%s-orthanc" (include "edge.fullname" .) | quote }},
      "DicomAet": {{ .Values.orthanc.aet | quote }},
      "DicomPort": {{ .Values.orthanc.dicomPort }},
      "HttpPort": {{ .Values.orthanc.httpPort }},

      "StorageDirectory": "/data/orthanc-storage",
      "IndexDirectory": "/data/orthanc-storage",
      "StorageCompression": false,

      {{- /* Orthanc's own recycler. Left at 0 (unlimited) so that
             dataPolicy.derived.orthancStorage is the ONLY thing that removes
             anything — two independent expiry mechanisms racing over the same
             data is how studies vanish before they are uploaded. */}}
      "MaximumStorageSize": {{ .Values.dataPolicy.derived.orthancStorage.maximumStorageSizeMB }},
      "MaximumPatientCount": {{ .Values.dataPolicy.derived.orthancStorage.maximumPatientCount }},

      {{- /* LOAD-BEARING. OnStableStudy fires only after a study has been
             silent this long, and that is what applies the label group-orthanc
             filters on. Drop it and the pipeline stalls with data sitting in
             Orthanc and no error anywhere. */}}
      "StableAge": {{ .Values.orthanc.stableAge }},

      "RemoteAccessAllowed": true,
      "AuthenticationEnabled": {{ .Values.orthanc.auth.enabled }},
        {{- /* NO "RegisteredUsersFile" KEY HERE, AND THERE NEVER SHOULD HAVE BEEN.
               Orthanc has no such option. It ignored the key silently, ended up
               with ZERO registered users, and with AuthenticationEnabled=true
               refused EVERY request including correct credentials. MEASURED
               against jodogne/orthanc-plugins:1.12.11, two containers identical
               but for the mechanism:

                 RegisteredUsersFile:          authenticated=401 anonymous=401
                 users.json in the config dir: authenticated=200 anonymous=401

               Users are supplied instead by mounting the Secret's users.json
               INTO /etc/orthanc, which Orthanc scans. Its own startup line is
               `Scanning folder "/etc/orthanc" for configuration files`, and the
               Book documents that every .json in that folder is loaded and
               merged. The Secret's users.json is already shaped as a config
               fragment, {"RegisteredUsers":{...}}, so it merges as written.
               The mount is in orthanc-deployment.yaml. */}}

      {{- with .Values.orthanc.ingestTranscoding }}
      {{- /* Rewrites pixel data at RECEIVE time, before the Lua hook runs, so
             the facility backup would hold the transcoded copy rather than the
             wire original. Only set this where there is no archive of record
             to preserve. */}}
      "IngestTranscoding": {{ . | quote }},
      {{- end }}
      "DicomScuTimeout": {{ .Values.orthanc.dicomScuTimeout }},

      "DicomModalities": {},

      {{- with .Values.orthanc.plugins }}
      "Plugins": {{ toJson . }},
      {{- end }}

      {{- /* THE HOOK DOES MORE THAN DE-IDENTIFY. It also writes the facility
             backup (the archive of record, with original identifiers) and
             quarantines instances from unmapped AE titles. Loading it only when
             it is the de-identification engine meant that choosing
             deid.engine=ingest silently gave up BOTH: the archive stopped having
             a writer, which produces no error and no log line, because an absent
             writer is indistinguishable from a quiet site.
      
             It now loads whenever it has any job left to do, and the
             de-identification half is switched off from inside the script by
             Defaults.DeidEnabled. */}}
      {{- if or (eq (include "edge.deidEngine" .) "orthanc") .Values.storage.facilityBackup.enabled }}
      "LuaScripts": ["/etc/orthanc/scripts/deidentify-and-forward.lua"]
      {{- else }}
      "LuaScripts": []
      {{- end }}
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "edge.fullname" . }}-orthanc-scripts
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "edge.labels" . | nindent 4 }}
data:
  {{- /* .Files.Get, never inlined: the hook is 200+ lines of Lua containing
         braces and quoting that Helm templating would mangle, and keeping it
         a real file means it stays lintable and diffable. */}}
  deidentify-and-forward.lua: |
    {{- .Files.Get "files/deidentify-and-forward.lua" | nindent 4 }}
{{- /* Rendered whenever the script is loaded, which is now also the case with
       another engine selected, because the script still archives originals and
       quarantines unmapped AE titles. Loading a script whose configuration file
       does not exist would abort every instance at the first read. */}}
{{- if or (eq (include "edge.deidEngine" .) "orthanc") .Values.storage.facilityBackup.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "edge.fullname" . }}-orthanc-routing
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "edge.labels" . | nindent 4 }}
data:
  {{- /* Mounted at /etc/ais-edge, NOT /etc/orthanc — see the header. */}}
  routing.json: |
    {
      "_README": "Generated from orthanc.deid.aetMap. An AE title that is not listed here is REJECTED for ingest but NOT discarded: the original instance is written under FacilityBackupDir/__unmapped_aet__/<AET>/... and only then removed from Orthanc, and if that write fails the instance is kept. Add the AET here and re-send to ingest it.",
      "AETMap": {{ toJson .Values.orthanc.deid.aetMap }},
      "Defaults": {
        "DeidentificationProfileFile": "/etc/ais-edge/deidentification-profile.json",
        "FacilityBackupDir": "/facility-backup",
        "_DeidEnabledREADME": "false when deid.engine is not orthanc. The script still archives the original and quarantines unmapped AE titles; it just does not modify the instance, because another stage does that instead.",
        "DeidEnabled": {{ eq (include "edge.deidEngine" .) "orthanc" }}
      }
    }
  deidentification-profile.json: |
    {{- toJson .Values.orthanc.deid.profile | nindent 4 }}
{{- end }}

{{- end }}
