{{- /*
The ingest pipeline: group -> assign.

    group-orthanc   pull labelled studies out of Orthanc, hardlink their
                    instances into /data/grouped as sessions
    group (fs)      optional second source: a watched directory
    assign          derive project/subject/session and collate into
                    /data/assigned, ready for upload

Every stage mounts the SAME pipeline PVC at /data. That is required, not
tidiness: the stages hardlink between orthanc-storage/, grouped/ and
assigned/, and a hardlink cannot cross a filesystem boundary. Split them and
`hardlink_or_copy` silently degrades to a full byte copy of every study.
*/ -}}
{{- $img := printf "%s:%s" .Values.ingest.image.repository .Values.ingest.image.tag -}}
{{- if and .Values.ingest.orthancGroup.enabled (not .Values.ingest.stanford.enabled) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "edge.fullname" . }}-group-orthanc
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "edge.labels" . | nindent 4 }}
    app: xnat-ingest
    component: group
spec:
  replicas: 1
  # Two groupers against one Orthanc would double-pull the same studies.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: xnat-ingest
      component: group
  template:
    metadata:
      labels:
        {{- include "edge.labels" . | nindent 8 }}
        app: xnat-ingest
        component: group
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- include "edge.hostAliases" . | nindent 6 }}
      {{- include "edge.schedulingRules" . | nindent 6 }}
      automountServiceAccountToken: {{ .Values.serviceAccounts.automountToken }}
      containers:
        - name: group
          image: {{ $img }}
          imagePullPolicy: {{ .Values.ingest.image.pullPolicy }}
          command: ["xnat-ingest", "group-orthanc"]
          args:
            - {{ include "edge.orthancUrl" . | quote }}
            - {{ .Values.orthanc.storageDirectory | quote }}
            - "/data/grouped"
            - "$(ORTHANC_USER)"
            - "$(ORTHANC_PASSWORD)"
            {{- /* ONLY when the Lua hook is the engine, because the hook is
                   what applies this label. Under any other engine nothing
                   applies it, and filtering on it would make group-orthanc skip
                   every study and stall the pipeline with no error. Derived
                   rather than declared so an operator cannot leave it set by
                   mistake while switching engines. */}}
            {{- with (or (eq (include "edge.deidEngine" $) "orthanc") (not $.Values.orthanc.enabled)) | ternary .Values.ingest.orthancGroup.toProcessLabel "" }}
            # Only studies carrying this label are pulled. The de-id hook
            # applies it in OnStableStudy, AFTER the original has been backed
            # up and the instance de-identified — which is what makes the
            # label the gate that stops identifiable data leaving Orthanc.
            - "--to-process-label"
            - {{ . | quote }}
            {{- end }}
            - "--processed-label"
            - {{ .Values.ingest.orthancGroup.processedLabel | quote }}
            - "--copy-mode"
            - {{ .Values.ingest.orthancGroup.copyMode | quote }}
            - "--wait-period"
            - {{ .Values.ingest.orthancGroup.waitPeriod | quote }}
            - "--loop"
            - {{ .Values.ingest.orthancGroup.interval | quote }}
          env:
            {{- include "edge.logEnv" . | nindent 12 }}
            {{- if .Values.orthanc.auth.enabled }}
            - name: ORTHANC_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.orthanc.auth.existingSecret }}
                  key: orthanc-user
            - name: ORTHANC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.orthanc.auth.existingSecret }}
                  key: orthanc-password
            {{- else }}
            # Orthanc REST auth is off, but group-orthanc still requires
            # positional user/password arguments.
            - name: ORTHANC_USER
              value: "orthanc"
            - name: ORTHANC_PASSWORD
              value: "orthanc"
            {{- end }}
          volumeMounts:
            {{- include "edge.pipelineVolumeMount" . | nindent 12 }}
      volumes:
        {{- include "edge.pipelineVolume" . | nindent 8 }}
---
{{- end }}
{{- if .Values.ingest.fileDrop.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "edge.fullname" . }}-group-fs
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "edge.labels" . | nindent 4 }}
    app: xnat-ingest
    component: group-fs
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: xnat-ingest
      component: group-fs
  template:
    metadata:
      labels:
        {{- include "edge.labels" . | nindent 8 }}
        app: xnat-ingest
        component: group-fs
    spec:
      {{- include "edge.hostAliases" . | nindent 6 }}
      {{- include "edge.schedulingRules" . | nindent 6 }}
      automountServiceAccountToken: {{ .Values.serviceAccounts.automountToken }}
      containers:
        - name: group-fs
          image: {{ $img }}
          imagePullPolicy: {{ .Values.ingest.image.pullPolicy }}
          command: ["xnat-ingest", "group"]
          args:
            - {{ .Values.ingest.fileDrop.inputGlob | quote }}
            - "/data/grouped"
            {{- range splitList ";" .Values.ingest.fileDrop.datatypes }}
            {{- if . }}
            - "--datatype"
            - {{ . | quote }}
            {{- end }}
            {{- end }}
            # EXPLICIT, because 0.15.0 changed the default from "avoid" to none at all.
            # In 0.13.1 `group` defaulted to --on-resource-clash=avoid and a repeated
            # resource name was silently suffixed _2/_3. In 0.15.0 the option takes a
            # <policy> <scope> pair and defaults to (), so an uncovered clash RAISES out
            # of the loop and this stage stops. Passing it restores 0.13.1 behaviour.
            #
            # ON THIS STAGE ONLY. `group-orthanc` has no such option and would die with
            # "no such option", and NOT via XINGEST_ON_RESOURCE_CLASH: that variable is
            # still a plain click.Choice on `associate` and `deidentify`, where the pair
            # form "avoid all" is not a valid choice.
            - "--on-resource-clash"
            - "avoid"
            - "all"
            - "--copy-mode"
            - {{ .Values.ingest.fileDrop.copyMode | quote }}
            - "--wait-period"
            - {{ .Values.ingest.fileDrop.waitPeriod | quote }}
            - "--loop"
            - {{ .Values.ingest.fileDrop.interval | quote }}
          env:
            {{- include "edge.logEnv" . | nindent 12 }}
            {{- if ne .Values.dataPolicy.originals.fileDrop.reclaim "never" }}
            # Deleting what was just read. On this path there is no Orthanc
            # copy and no facility backup, so the watched directory is the
            # only copy — which is why dataPolicy defaults this to never and
            # the chart refuses the combination while dataPolicy is enforced.
            - name: XINGEST_UNLINK_SOURCE
              value: "all"
            {{- end }}
          volumeMounts:
            {{- include "edge.pipelineVolumeMount" . | nindent 12 }}
      volumes:
        {{- include "edge.pipelineVolume" . | nindent 8 }}
---
{{- end }}
{{- if and (or .Values.ingest.orthancGroup.enabled .Values.ingest.fileDrop.enabled) (not .Values.ingest.stanford.enabled) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "edge.fullname" . }}-assign
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "edge.labels" . | nindent 4 }}
    app: xnat-ingest
    component: assign
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: xnat-ingest
      component: assign
  template:
    metadata:
      labels:
        {{- include "edge.labels" . | nindent 8 }}
        app: xnat-ingest
        component: assign
    spec:
      {{- include "edge.hostAliases" . | nindent 6 }}
      {{- include "edge.schedulingRules" . | nindent 6 }}
      automountServiceAccountToken: {{ .Values.serviceAccounts.automountToken }}
      containers:
        - name: assign
          image: {{ $img }}
          imagePullPolicy: {{ .Values.ingest.image.pullPolicy }}
          command: ["xnat-ingest", "assign"]
          args:
            - "/data/grouped"
            - "/data/assigned"
            # project/subject/session come from the DICOM tags the de-id hook
            # writes. routing.json's AETMap is the single source of truth for
            # project — there is no hardcoded project ID anywhere.
            - "--project"
            - {{ get (include "edge.assignTagMapping" . | fromYaml) "project" | quote }}
            - "--subject"
            - {{ get (include "edge.assignTagMapping" . | fromYaml) "subject" | quote }}
            - "--session"
            - {{ get (include "edge.assignTagMapping" . | fromYaml) "session" | quote }}
            - "--copy-mode"
            - {{ .Values.ingest.assign.copyMode | quote }}
            {{- if eq .Values.dataPolicy.derived.grouped.reclaim "onAssigned" }}
            # dataPolicy.derived.grouped.reclaim = onAssigned.
            #
            # Drop each grouped session once it has been assigned. Without
            # this, `assign --loop` rebuilds its work list from a live
            # listing of /data/grouped every cycle and re-assigns the same
            # sessions forever: /data/assigned is repopulated, the uploader
            # re-stages, and the upload-success alert re-fires. That produced
            # two days of duplicate mail.
            #
            # This deletes HARDLINKS, not data. The bytes remain in Orthanc
            # storage and in the facility backup, both governed by
            # dataPolicy.originals and both defaulting to forever.
            - "--unlink-source"
            - "all"
            {{- end }}
            - "--loop"
            - {{ .Values.ingest.assign.interval | quote }}
          env:
            {{- include "edge.logEnv" . | nindent 12 }}
          volumeMounts:
            {{- include "edge.pipelineVolumeMount" . | nindent 12 }}
      volumes:
        {{- include "edge.pipelineVolume" . | nindent 8 }}
{{- end }}
{{- if and (eq (include "edge.deidEngine" .) "ingest") .Values.ingest.deidentify.specs }}
---
{{/*
  The de-identification recipes, from the site file.

  A ConfigMap key must match [-._a-zA-Z0-9], so the '/' and '@' that
  xnat-ingest needs in the path cannot be stored as a key. Each path is
  sanitised into a legal key here and mapped back to the real path with
  items[].path on the volume below, so the operator writes real paths and never
  sees the restriction.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "edge.fullname" . }}-deid-specs
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "edge.labels" . | nindent 4 }}
data:
  {{- range $path, $recipe := .Values.ingest.deidentify.specs }}
  {{ regexReplaceAll "[^-._a-zA-Z0-9]" $path "-" }}: |
    {{- $recipe | nindent 4 }}
  {{- end }}
{{- end }}
{{- if (eq (include "edge.deidEngine" .) "ingest") }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "edge.fullname" . }}-deidentify
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "edge.labels" . | nindent 4 }}
    app: xnat-ingest
    component: deidentify
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: xnat-ingest
      component: deidentify
  template:
    metadata:
      labels:
        {{- include "edge.labels" . | nindent 8 }}
        app: xnat-ingest
        component: deidentify
    spec:
      {{- include "edge.hostAliases" . | nindent 6 }}
      {{- include "edge.schedulingRules" . | nindent 6 }}
      automountServiceAccountToken: {{ .Values.serviceAccounts.automountToken }}
      containers:
        - name: deidentify
          image: {{ $img }}
          imagePullPolicy: {{ .Values.ingest.image.pullPolicy }}
          command: ["xnat-ingest", "deidentify"]
          args:
            - "/data/assigned"
            - "/data/deidentified"
            - "/etc/xnat-ingest/deid-specs"
            # --reid-dir, NOT a fourth positional. xnat-ingest 0.15.0 made reid_dir an
            # OPTION; passing it positionally is rejected outright:
            #   Usage: xnat-ingest deidentify [OPTIONS] INPUT_DIR OUTPUT_DIR SPEC_DIR
            #   Error: Got unexpected extra argument (/data/reid)
            # Measured against ghcr.io/australian-imaging-service/xnat-ingest:0.15.0.
            - "--reid-dir"
            - "/data/reid"
            - "--copy-mode"
            - {{ .Values.ingest.deidentify.copyMode | quote }}
            {{- if eq (include "edge.assignedReclaim" $) "onDeidentified" }}
            # THIS TESTED "onAssigned" UNTIL NOW, WHICH COULD NEVER BE TRUE:
            # onAssigned belongs to the `grouped` key and is not in this key's
            # enum, so the flag was never passed at any site. Confirmed on a
            # live edge, whose deidentify container had no --unlink-source.
            # Same reasoning as assign: without this, `--loop` rebuilds its
            # work list from a live listing every cycle and re-processes
            # sessions it has already done. Deletes hardlinks, not data.
            - "--unlink-source"
            - "all"
            {{- end }}
            - "--loop"
            - {{ .Values.ingest.deidentify.interval | quote }}
          env:
            {{- include "edge.logEnv" . | nindent 12 }}
            {{- if .Values.ingest.deidentify.reidEncryptKeySecret }}
            - name: XINGEST_REID_ENCRYPT_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.ingest.deidentify.reidEncryptKeySecret }}
                  key: XINGEST_REID_ENCRYPT_KEY
            {{- end }}
          volumeMounts:
            {{- include "edge.pipelineVolumeMount" . | nindent 12 }}
            - name: deid-specs
              mountPath: /etc/xnat-ingest/deid-specs
              readOnly: true
      volumes:
        {{- include "edge.pipelineVolume" . | nindent 8 }}
        - name: deid-specs
          configMap:
            {{- if .Values.ingest.deidentify.specs }}
            name: {{ include "edge.fullname" . }}-deid-specs
            items:
              {{- range $path, $recipe := .Values.ingest.deidentify.specs }}
              - key: {{ regexReplaceAll "[^-._a-zA-Z0-9]" $path "-" | quote }}
                path: {{ $path | quote }}
              {{- end }}
            {{- else }}
            name: {{ .Values.ingest.deidentify.specConfigMap }}
            {{- if .Values.ingest.deidentify.specFiles }}
            items:
              {{- range $key, $path := .Values.ingest.deidentify.specFiles }}
              - key: {{ $key | quote }}
                path: {{ $path | quote }}
              {{- end }}
            {{- end }}
            {{- end }}
{{- end }}
{{- if .Values.ingest.associate.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "edge.fullname" . }}-associate
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "edge.labels" . | nindent 4 }}
    app: xnat-ingest
    component: associate
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: xnat-ingest
      component: associate
  template:
    metadata:
      labels:
        {{- include "edge.labels" . | nindent 8 }}
        app: xnat-ingest
        component: associate
    spec:
      {{- include "edge.schedulingRules" . | nindent 6 }}
      automountServiceAccountToken: {{ .Values.serviceAccounts.automountToken }}
      containers:
        - name: associate
          image: {{ $img }}
          imagePullPolicy: {{ .Values.ingest.image.pullPolicy }}
          command: ["xnat-ingest", "associate"]
          args:
            - "/data/assigned"
            {{- range splitList ";" .Values.ingest.associate.datatypes }}
            {{- if . }}
            - "--datatype"
            - {{ . | quote }}
            {{- end }}
            {{- end }}
            - "--copy-mode"
            - {{ .Values.ingest.associate.copyMode | quote }}
          env:
            {{- include "edge.logEnv" . | nindent 12 }}
          volumeMounts:
            {{- include "edge.pipelineVolumeMount" . | nindent 12 }}
      volumes:
        {{- include "edge.pipelineVolume" . | nindent 8 }}
{{- end }}
