{{- /*
Upload. Exactly one of these two renders — see upload.mode in values.yaml.
Both enabled would push every session into XNAT twice, which is why the mode
is a single enum rather than two booleans.
*/ -}}
{{- if eq .Values.upload.mode "s3" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "edge.fullname" . }}-s3-uploader
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "edge.labels" . | nindent 4 }}
data:
  {{- /* .Files.Get: the script contains ${...} and backticks that Helm
         templating would otherwise have to be escaped around, and keeping it
         a real file means `bash -n` can lint it in CI. */}}
  s3-uploader.sh: |
    {{- .Files.Get "files/s3-uploader.sh" | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "edge.fullname" . }}-s3-uploader
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "edge.labels" . | nindent 4 }}
    app: xnat-ingest
    component: s3-uploader
spec:
  replicas: 1
  # Two uploaders would race on the same session directories and on the
  # reclaim that follows a successful sync.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: xnat-ingest
      component: s3-uploader
  template:
    metadata:
      labels:
        {{- include "edge.labels" . | nindent 8 }}
        app: xnat-ingest
        # LOAD-BEARING LABEL. Every s3-uploader alert rule and dashboard
        # panel selects on component="s3-uploader". Renaming it disables
        # them silently.
        component: s3-uploader
      annotations:
        # Checksum the script FILE, not the rendered template. Including the
        # template that contains this annotation recurses infinitely, and
        # hashing the file is more precise anyway: the pod rolls exactly when
        # the uploader logic changes.
        checksum/script: {{ .Files.Get "files/s3-uploader.sh" | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- include "edge.hostAliases" . | nindent 6 }}
      {{- include "edge.schedulingRules" . | nindent 6 }}
      automountServiceAccountToken: {{ .Values.serviceAccounts.automountToken }}
      initContainers:
        {{- /*
        THE S3 CLIENT AND THE USERLAND COME FROM DIFFERENT IMAGES, AND THAT IS
        A DECISION. This container exists only to lift the rclone binary out of
        the pinned rclone image into an emptyDir that the uploader then finds on
        its PATH.

        Running the loop IN rclone/rclone instead was the obvious shape and is
        wrong twice over. That image is Alpine, so:
          * there is no /bin/bash at all — `command: ["/bin/bash", ...]` is an
            instant CrashLoopBackOff, which is the loud half; and
          * busybox `find` has no `-printf` and no `-xtype`, which is the
            silent half. Measured in rclone/rclone:1.75.0 against a real
            session tree: fingerprint() returns the md5 of an empty string for
            EVERY session, so a changed session is never re-uploaded, and the
            dangling-symlink guard never fires, so a session with missing files
            can reach XNAT. Neither errors; both are invisible in a render.
        This is the same wall the migration off busybox-based `minio/mc` hit —
        see docs/components/mc.md, "A full userland".

        rclone is a static Go binary with no libc dependency, so the copy runs
        unchanged in the glibc image below; verified end to end (version, lsd,
        copy) against SeaweedFS 4.34.
        */}}
        - name: rclone-bin
          image: "{{ .Values.upload.s3.image.repository }}:{{ .Values.upload.s3.image.tag }}"
          imagePullPolicy: {{ .Values.upload.s3.image.pullPolicy }}
          # This image's entrypoint is `rclone` itself, so it has to be
          # overridden even here, just to run `cp`.
          command: ["/bin/sh", "-c", "cp /usr/local/bin/rclone /opt/rclone/rclone"]
          volumeMounts:
            - name: rclone-bin
              mountPath: /opt/rclone
          resources:
            requests: {memory: 32Mi, cpu: 10m}
            limits:   {memory: 128Mi, cpu: 200m}
      containers:
        - name: uploader
          # NOT the S3 client — see upload.s3.shell.image in values.yaml. This
          # image supplies bash + GNU coreutils/findutils; rclone arrives from
          # the initContainer above.
          image: "{{ .Values.upload.s3.shell.image.repository }}:{{ .Values.upload.s3.shell.image.tag }}"
          imagePullPolicy: {{ .Values.upload.s3.shell.image.pullPolicy }}
          # The image's entrypoint is `aws`; override it to run our loop.
          command: ["/bin/bash", "/scripts/s3-uploader.sh"]
          env:
            - name: EDGE_NAME
              value: {{ .Values.clusterLabel | quote }}
            - name: S3_TRANSFERS
              value: {{ .Values.upload.s3.transfers | quote }}
            - name: S3_BANDWIDTH_LIMIT
              value: {{ .Values.upload.s3.bandwidthLimit | default "off" | quote }}
            - name: S3_BUCKET
              value: {{ include "edge.s3Bucket" . | quote }}
            - name: S3_PREFIX
              value: {{ .Values.upload.s3.prefix | quote }}
            - name: ASSIGNED_DIR
              value: {{ include "edge.uploadSourceDir" . }}
            - name: STATE_DIR
              value: {{ include "edge.uploaderStateDir" . | quote }}
            - name: INTERVAL
              value: {{ .Values.upload.s3.interval | quote }}
            - name: SETTLE_MINUTES
              value: {{ .Values.upload.s3.settleMinutes | quote }}
            # The marker sweep asks whether ANY stage still holds the session,
            # rather than how old the marker is. See s3-uploader.sh.
            - name: PIPELINE_ROOT
              value: /data
            # Derived by the SAME condition as ASSIGNED_DIR above, so the
            # uploader cannot take its permission to delete from the policy for
            # a tree it is not reading. See edge.uploadReclaim.
            - name: RECLAIM
              value: {{ include "edge.uploadReclaim" . | quote }}
            # dryRun OR disabled — either one means "upload, but do not
            # reclaim the local copy". Was `and .enabled .dryRun`, which with
            # the default dataPolicy.enabled=false yields DRY_RUN=false: a
            # switched-off data policy that deletes anyway. Nothing that
            # removes data should read a disabled policy as permission.
            # Matches charts/mgmt s3-staged-reclaimer.yaml.
            - name: DRY_RUN
              value: {{ or (not .Values.dataPolicy.enabled) .Values.dataPolicy.dryRun | quote }}

            # --- rclone remote "sw" ----------------------------------------
            # rclone builds a remote entirely from RCLONE_CONFIG_<NAME>_* env,
            # with no config file — which is why there is no rclone.conf
            # anywhere in this chart. NAME is upper-case in the variable and
            # lower-case in the URL, so these define the `sw:` the uploader
            # script uses. Same credential Secret and same keys as the AWS CLI
            # env they replace; nothing about the S3 identity changed.
            - name: RCLONE_CONFIG_SW_TYPE
              value: s3
            # Not cosmetic: `provider` selects rclone's per-vendor quirk set
            # (checksum headers, multipart behaviour, which optional API calls
            # it will attempt).
            - name: RCLONE_CONFIG_SW_PROVIDER
              value: SeaweedFS
            - name: RCLONE_CONFIG_SW_ENDPOINT
              value: {{ include "edge.s3Endpoint" . | quote }}
            # SeaweedFS ignores the region, but SigV4 signs over it, so it has
            # to be some fixed value on both sides.
            - name: RCLONE_CONFIG_SW_REGION
              value: {{ .Values.upload.s3.region | quote }}
            # Addressing style is deliberately not set. rclone's s3 backend
            # defaults force_path_style=true, and it stays true for SeaweedFS —
            # measured, the request URL comes out https://<endpoint>/<bucket>?…
            # with the bucket in the PATH, which is what the single-SAN
            # SeaweedFS certificate needs. Setting it would only risk turning
            # that off.
            - name: RCLONE_CONFIG_SW_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.upload.s3.existingSecret }}
                  key: access-key
            - name: RCLONE_CONFIG_SW_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.upload.s3.existingSecret }}
                  key: secret-key
            {{- if .Values.upload.s3.caBundleSecret }}
            # KEPT CONDITIONAL, though the reason is now weaker than it was.
            # An empty AWS_CA_BUNDLE did not fall back to the system trust
            # store — it disabled certificate verification entirely and merely
            # logged "Unverified HTTPS request is being made". MEASURED for
            # rclone 1.75.0 against a self-signed endpoint: RCLONE_CA_CERT=""
            # behaves exactly like unset — it still verifies, against the
            # system store, and still rejects an unknown authority. So an empty
            # value here would be harmless rather than dangerous.
            # It stays conditional anyway: a CA path that is set but missing is
            # a hard CRITICAL at startup (also measured), the mount below is
            # gated on the same key so an unconditional env would point at a
            # path that does not exist, and _helpers.tpl still refuses to
            # render an https endpoint with no CA configured.
            - name: RCLONE_CA_CERT
              value: /etc/ssl/ais-edge/{{ .Values.upload.s3.caBundleKey }}
            {{- end }}
            {{- if .Values.upload.s3.requireClientCert }}
            {{- /*
            SERVER TRUST AND OUR OWN IDENTITY ARE TWO SEPARATE THINGS, and this
            block is deliberately not nested inside the caBundleSecret one
            above. RCLONE_CA_CERT answers "who signed the endpoint's
            certificate"; these answer "who are we". On cloud the first can
            legitimately be a public CA already in the system trust store — so
            caBundleSecret empty — while the client certificate still comes from
            the fleet's own CA via cert-sync. Coupling them would silently drop
            our identity on exactly the topology that needs it stated.

            rclone maps its global --client-cert / --client-key flags to these
            names, the same mechanism RCLONE_CA_CERT uses. Both must be set —
            verified end to end against nginx ssl_verify_client on and
            SeaweedFS 4.34: with the pair present the probe and the transfer
            succeed; with the certificate FILE absent rclone exits
            `CRITICAL: Failed to load --client-cert/--client-key pair`, and
            with no certificate at all the endpoint answers HTTP 400 and rclone
            reports an S3 XML parse failure that mentions neither.
            */}}
            - name: RCLONE_CLIENT_CERT
              value: /etc/ssl/s3-client/tls.crt
            - name: RCLONE_CLIENT_KEY
              value: /etc/ssl/s3-client/tls.key
            {{- end }}
          resources:
            {{- toYaml .Values.upload.s3.resources | nindent 12 }}
          volumeMounts:
            {{- include "edge.pipelineVolumeMount" . | nindent 12 }}
            - name: scripts
              mountPath: /scripts
              readOnly: true
            # The staged rclone binary. The script prepends this to PATH;
            # the mount path and that prepend must agree.
            - name: rclone-bin
              mountPath: /opt/rclone
              readOnly: true
            {{- if .Values.upload.s3.caBundleSecret }}
            - name: ca-bundle
              mountPath: /etc/ssl/ais-edge
              readOnly: true
            {{- end }}
            {{- if .Values.upload.s3.requireClientCert }}
            # Its OWN directory, not a subpath of /etc/ssl/ais-edge: that path
            # is already a Secret mount, and nesting one volume inside another
            # depends on mount ordering the kubelet does not promise. Same
            # separation charts/edge/templates/vector.yaml makes for the Loki
            # client certificate.
            - name: s3-client
              mountPath: /etc/ssl/s3-client
              readOnly: true
            {{- end }}
      volumes:
        {{- include "edge.pipelineVolume" . | nindent 8 }}
        - name: scripts
          configMap:
            name: {{ include "edge.fullname" . }}-s3-uploader
            defaultMode: 0755
        # Handoff between the initContainer and the loop. emptyDir, not a PVC:
        # it is re-populated from the image on every pod start, so it must NOT
        # survive one — a stale rclone left behind by a rolled-back image tag
        # is exactly the drift the pinning is there to prevent.
        - name: rclone-bin
          emptyDir: {}
        {{- if .Values.upload.s3.caBundleSecret }}
        - name: ca-bundle
          secret:
            secretName: {{ .Values.upload.s3.caBundleSecret }}
        {{- end }}
        {{- if .Values.upload.s3.requireClientCert }}
        # NOT marked optional — same call as the Loki client certificate in
        # vector.yaml, for the same reason. This Secret is written by the
        # management cert-sync CronJob, not by this chart, so a freshly built
        # site renders this manifest before it exists. An optional mount would
        # let the uploader start with no identity, every transfer would be
        # rejected at the handshake, and the site would look healthy while
        # shipping nothing. Failing to start is the visible failure, and it is
        # the one we want.
        #
        # No items: mapping — kubernetes.io/tls fixes the key names, so nothing
        # here can drift out of step with the env above. No defaultMode either:
        # 0400 would need the container's UID to match the file owner, and this
        # pod sets no runAsUser.
        - name: s3-client
          secret:
            secretName: {{ .Values.upload.s3.clientCertSecret }}
        {{- end }}
{{- else if eq .Values.upload.mode "direct" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "edge.fullname" . }}-upload
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "edge.labels" . | nindent 4 }}
    app: xnat-ingest
    component: upload
spec:
  replicas: {{ .Values.upload.direct.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: xnat-ingest
      component: upload
  template:
    metadata:
      labels:
        {{- include "edge.labels" . | nindent 8 }}
        app: xnat-ingest
        component: upload
    spec:
      {{- include "edge.hostAliases" . | nindent 6 }}
      {{- include "edge.schedulingRules" . | nindent 6 }}
      automountServiceAccountToken: {{ .Values.serviceAccounts.automountToken }}
      containers:
        - name: upload
          image: "{{ .Values.ingest.image.repository }}:{{ .Values.ingest.image.tag }}"
          imagePullPolicy: {{ .Values.ingest.image.pullPolicy }}
          # xnat-ingest loops internally via --loop; no bash wrapper needed.
          command: ["xnat-ingest", "upload"]
          args:
            - {{ include "edge.uploadSourceDir" . | quote }}
            - "$(XINGEST_HOST)"
            - "--always-include"
            - {{ .Values.upload.direct.alwaysInclude | quote }}
            - "--loop"
            - {{ .Values.upload.direct.loop | quote }}
            - "--wait-period"
            - {{ .Values.upload.direct.waitPeriod | quote }}
            {{- if not .Values.upload.direct.requireManifest }}
            - "--dont-require-manifest"
            {{- end }}
            {{- if not .Values.upload.direct.verifySsl }}
            - "--dont-verify-ssl"
            {{- end }}
          env:
            {{- include "edge.logEnv" . | nindent 12 }}
            - name: XINGEST_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.upload.direct.existingSecret }}
                  key: server
            - name: XINGEST_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.upload.direct.existingSecret }}
                  key: username
            - name: XINGEST_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.upload.direct.existingSecret }}
                  key: password
            - name: XINGEST_TEMPDIR
              value: {{ .Values.upload.direct.tempDir | quote }}
          resources:
            {{- toYaml .Values.upload.direct.resources | nindent 12 }}
          volumeMounts:
            {{- include "edge.pipelineVolumeMount" . | nindent 12 }}
      volumes:
        {{- include "edge.pipelineVolume" . | nindent 8 }}
{{- end }}
