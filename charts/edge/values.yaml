# =============================================================================
# AIS Edge — edge-site chart
# =============================================================================
# One chart, one edge site. It runs in whichever cluster you point it at: a
# k0smotron-hosted child cluster (tier-2, upload.mode=s3) or a plain
# single-node k0s box (tier-1, upload.mode=direct). Nothing in here assumes a
# management plane exists; that lives in charts/mgmt.
#
# HOW TO READ THIS FILE
#   1. dataPolicy    — what is kept and for how long. Read this first.
#   2. storage       — where the bytes physically land.
#   3. orthanc       — the DICOM receiver and de-identification.
#   4. ingest        — group -> assign, and the optional file-drop path.
#   5. upload        — how sessions reach XNAT (via S3, or directly).
#   6. samba         — optional SMB drop-box.
#   7. observability — optional log shipping to the management cluster.
#
# CREDENTIALS ARE NOT IN THIS FILE, BY DESIGN.
# Every credential is referenced by Secret name only. Nothing here is secret,
# so this file is safe to commit per-site. Secrets are created separately
# (SOPS-encrypted under sites/<site>/secrets.enc.yaml) and referenced by the
# existingSecret keys below. Never add a password, key or salt to this file.
# =============================================================================

namespace: xnat-ingest

# Resource names are prefixed with the Helm release name. Override only if you
# need two independent installs to coexist in one cluster.
nameOverride: ""
fullnameOverride: ""

# onprem | cloud
# Replaces the old {{#ONPREM_ONLY}} awk-stripping in scripts/00-common.sh.
# onprem pins management hostnames via hostAliases; cloud resolves them via
# real DNS and skips the aliases entirely.
topology: onprem

# =============================================================================
# DE-IDENTIFICATION ENGINE - ONE SWITCH, and everything else follows from it
# =============================================================================
# GUIDING: set this and nothing else about de-identification wiring.
#
#   orthanc   the Orthanc Lua hook strips each instance as it ARRIVES, and also
#             writes the ClinicalTrial* routing tags from the AE-title map and
#             applies the label group-orthanc filters on. One-way: no crosswalk.
#   ingest    the xnat-ingest `deidentify` stage runs between assign and upload.
#             REVERSIBLE by design - it writes a per-session re-identification
#             map. Costs: identifiable data passes through Orthanc, group and
#             assign before it is cleaned, there is no AE-title routing, and
#             ingest.assign.tagMapping must name tags the modalities populate.
#   none      neither. Only for sites whose modalities de-identify upstream.
#             Requires deid.policyReviewed=true to acknowledge it.
#
# WHY THIS IS ONE KEY. It used to be two booleans plus a label plus a tag
# mapping plus a reclaim word, all of which had to agree - but only at RUN time,
# so a half-switched site came up clean and then failed silently.
deid:
  # DEFAULT: ingest. xnat-ingest's own deidentify stage, between assign and
  # upload, driven by ingest.deidentify.specs (pydicom-deid recipes). It can do
  # things the Lua profile cannot, JITTER on dates among them.
  #
  # ORTHANC IS STILL THE DICOM RECEIVER either way. This key chooses only which
  # component de-identifies. Modalities still C-STORE to it on 4242, and the Lua
  # script still writes the facility backup and quarantines unmapped AE titles;
  # under `ingest` it simply stops modifying the instance.
  #
  # SWITCHING TO orthanc IS THREE EDITS: this key, DELETE the
  # ingest.deidentify.specs block (recipes for a stage that no longer renders are
  # refused, because silently ignoring them is how a reviewed policy stops being
  # applied), and put ingest.assign.tagMapping back to the ClinicalTrial* tags the
  # hook writes. The dataPolicy reclaim words follow automatically: they are
  # `auto` and the chart resolves them per engine.
  engine: ingest             # ingest | orthanc | none

  # THE GATE. The chart refuses to render until a human confirms this site's
  # de-identification policy. Deliberately has no safe default.
  #
  # It gates EVERY value of `engine`, which is why it lives here and not under
  # the component that happens to apply the recipe. What you are confirming
  # follows from `engine`:
  #
  #   ingest    ingest.deidentify.specs   (the default)
  #   orthanc   orthanc.deid.profile
  #   none      nothing here de-identifies; you are confirming the modalities
  #             already did it upstream
  #
  # You are confirming the POLICY, not the component. Nothing downstream
  # re-checks what was removed, under any engine.
  #
  # MOVED from orthanc.deid.policyReviewed. It was never Orthanc's: under
  # `engine: ingest` it asked an operator to confirm the Lua profile while the
  # recipe that actually ran was ingest.deidentify.specs. The old path now
  # fails the render with a message naming this one.
  policyReviewed: false

# =============================================================================
# THE MANAGEMENT SITE FILE SUPPLIES THESE — you do not normally set them here
# =============================================================================
# GUIDING: pass both values files to the edge release —
#   helm upgrade --install edge charts/edge \
#       -f sites/<mgmt>/values.yaml -f sites/<edge>/values.yaml
# S3 endpoint, staging bucket, Loki endpoint and hostAliases derive from the
# mgmt file (see _helpers.tpl). CAUTION: setting any of these here still
# wins, but now must be kept in step with mgmt by hand — every mismatch here
# fails silently (uploader retries forever; mgmt sees an absence it is not
# watching for).
domain:
  internal: ""
  mgmtNodeIP: ""
hostnames:
  seaweedfs: ""
  grafana: ""
  loki: ""
seaweedfs:
  perSiteBuckets: true
  bucketPrefix: ingest

# Free-text label attached to every log line and metric from this site. It is
# what Grafana's `cluster` variable filters on, so it must be unique per site.
clusterLabel: ""


# =============================================================================
# 1. dataPolicy — THE one place that decides what is kept, where, how long
# =============================================================================
# originals: irreplaceable, removed here means gone for good — defaults to
# forever, change only against a records-retention obligation, never to free
# disk. derived: reconstructible from an original — safe to reclaim.
#
# CAUTION: every derived rule is (condition AND minAge), both required. A
# pure age rule would delete a session that never reached XNAT because a
# credential was wrong; a pure condition rule frees nothing the moment the
# confirmation signal breaks. Worst case with both: disk fills and you get an
# alert. Never: data quietly disappears.
#
# Same block passed to charts/mgmt — one copy in sites/<site>/values.yaml,
# each chart acts only on the stores it owns.
dataPolicy:

  # Master switch. While false, NOTHING in this chart deletes or expires
  # anything, whatever the rules below say. A fresh install therefore cannot
  # surprise you. Turn it on deliberately, after dryRun has shown you a week
  # of what it would have done.
  enabled: false

  # Log every reclaim decision and then do nothing. Leave true until the log
  # matches what you expect.
  dryRun: true

  # The engine that ENFORCES everything below. Without it the rules are only
  # declarations — which is how most of this block came to be unimplemented.
  #
  # It runs as its own DaemonSet attached to the VOLUMES, never as a sidecar on
  # Orthanc: retention is a storage concern, and hanging it off the
  # de-identifier means swapping that component silently ends edge disk
  # monitoring. Report-only today; it deletes nothing.
  #
  # enabled: false stops the reporting, NOT the policy — no alert can fire on
  # data nobody is measuring, so turning this off makes minFreeDiskPercent and
  # quarantine.alertAfter inert.
  reporter:
    enabled: true
    interval: 300              # seconds between passes
    # Blast-radius cap per stage per pass, and how long a tree must be quiet
    # before it is considered complete. Both mirror the S3 reclaimer's design.
    maxRemovals: 50
    settleMinutes: 5

    # WHEN TO CALL A SESSION STUCK.
    #
    # A session whose reclaim condition never comes true is kept, correctly and
    # for ever, and every pass logs the same reclaim_kept line. That drip is
    # indistinguishable from normal operation, so a permanently stuck session
    # looks exactly like a healthy one that was uploaded a minute ago.
    #
    # Past this age the engine raises stage_stuck instead, which an alert keys
    # on. NOTHING IS MOVED OR DELETED: the data stays exactly where it is, and
    # this only changes which event is emitted. Set 0 to disable.
    #
    # WHY IT ONLY REPORTS. Quarantining a stuck session means moving the input
    # AND removing the partial output as ONE action. Doing only the first leaves
    # an orphaned partial output with nothing left to repair it from, and the
    # upload stage would then collect it. This engine can do the first half, so
    # it does neither. (Its /data mount is also read-only unless retention is
    # armed, which would make a move work in one mode and silently not in the
    # other, but the two-operations argument holds regardless of the mount.)
    #
    # WHAT IT CANNOT SEE. The age measured is the newest mtime in the tree, so
    # this detects a stage that has gone QUIET without progressing. A session
    # being rewritten on every cycle never accumulates age and is invisible to
    # it. That case is confined to the deidentified stage running an xnat-ingest
    # without the metadata write-if-changed fix, where the output's
    # __METADATA__.json was rewritten every pass; with that fix the tree goes
    # quiet and this sees it.
    stuckAfter: 24h
    image:
      # Needs df, find, stat, date, awk AND curl. busybox has the first five but
      # no curl, and its wget cannot issue the DELETE the orthanc-rest backend
      # requires. curlimages/curl is alpine-based, so it still provides the
      # busybox coreutils the filesystem backend uses.
      repository: curlimages/curl
      tag: "8.11.1"
      pullPolicy: IfNotPresent
    # 10001 matches Orthanc's, which owns the pipeline tree. The mounts are
    # read-only, so this is about being able to READ every stage, not write.
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 10001
      runAsGroup: 10001
      fsGroup: 10001
    resources:
      # 5m = cgroup cpu.weight 1: yields to Burstable pods, NOT to BestEffort ones.
      requests: {cpu: 5m, memory: 16Mi}
      # cpu: 1, not a fraction: a sweep is a burst of pipelines (find | stat |
      # sort | md5sum), and at 100m it ran about 11x slower.
      # Even at 1 core most CFS periods it runs in are throttled (61%, ~0.2s
      # per sweep, measured on stream-2-ab-dev 2026-09-30). Harmless here:
      # tier-2 loads no CPUThrottlingHigh (charts/mgmt defaultRules.create: false).
      # Kept as a ceiling on small edges (2 vCPU in docs/clouds/openstack-nectar.md).
      # CAUTION: wherever kube-prometheus-stack's default rules scrape this
      #   pod, CPUThrottlingHigh flaps on it; drop limits.cpu there.
      limits:   {cpu: 1, memory: 64Mi}

  # ---------------------------------------------------------------------
  # ORIGINALS
  # ---------------------------------------------------------------------
  originals:

    # THE THIRD SWITCH. Originals are the only identifiable copy, so expiring
    # them needs its own deliberate act on top of enabled + dryRun. While this
    # is false the engine skips every `kind: original` stage AND the chart
    # mounts the facility backup read-only, so nothing can remove an original
    # even if the logic above were wrong.
    #
    # Turn it on only against a records-retention obligation, never to free
    # disk — minFreeDiskPercent exists to tell you about disk.
    allowExpiry: false

    # Identifiable DICOM exactly as it arrived off the wire. The Orthanc Lua
    # hook writes this BEFORE de-identification and only removes the instance
    # from Orthanc once the write has succeeded, so this is the archive of
    # record for the site.
    facilityBackup:
      enabled: true
      # WHERE THIS STAGE LIVES, as seen inside the pods. Every location below
      # already matches this chart's own volume mounts, so a fresh install
      # needs no edit — change one only if you move a mount or swap the
      # component that writes it.
      #
      # These exist so the policy engine needs no knowledge of Orthanc or
      # xnat-ingest: it walks declared paths. Replace the de-identifier (or
      # the ingest path) and the retention rules keep working — point the
      # location at the new store instead of rewriting a reclaimer.
      location: /facility-backup
      # forever | 30d | 90d | 7y
      #
      # WHAT A DURATION ACTUALLY DELETES — read this before setting one.
      #
      # The unit is the TOP-LEVEL ENTRY under location, which here is one
      # PATIENT (the tree is <PatientID>/<StudyUID>/<SOPUID>.dcm), and the age
      # used is the NEWEST file anywhere beneath it. So `retain: 30d` means:
      #
      #   A patient directory whose most recent file is older than 30 days is
      #   deleted ENTIRELY.
      #
      # Both halves of that matter:
      #   * a patient with ANY recent activity is fully protected, even if some
      #     of their studies are years old — the newest file wins, deliberately;
      #   * when a patient DOES expire, everything under them goes, including
      #     studies far older than the window. It is not per-study expiry.
      #
      # Needs dataPolicy.originals.allowExpiry as well; until that is true the
      # facility-backup volume is mounted read-only and nothing can be removed.
      retain: forever
      # Warn only. This never triggers a deletion — running low on disk is an
      # operational problem, not a licence to discard originals.
      minFreeDiskPercent: 10

    # Studies received on an AE title that routing.json does not map to a
    # project. They are originals too, and clearing them needs a HUMAN: an
    # operator adds the AET to the map and re-sends. A time-based rule here
    # would silently discard precisely the data nobody has dealt with yet,
    # so the default is forever and we nag instead.
    quarantine:
      # RELATIVE to facilityBackup.location, deliberately — the quarantine is
      # a subtree of the archive, so one absolute path would let the two drift
      # and the alert would then name a directory nothing writes to.
      subPath: __unmapped_aet__
      retain: forever
      alertAfter: 24h

    # Operator file drops. Only exists when ingest.fileDrop.enabled is true.
    # NOTHING else holds a copy of these — there is no Orthanc copy and no
    # facility backup on this path.
    fileDrop:
      # Root of ingest.fileDrop.inputGlob. Only read when that path is enabled.
      location: /data/incoming
      reclaim: never             # never | onIngested
      minAge: 30d                # additionally required when not 'never'

  # ---------------------------------------------------------------------
  # DERIVED
  # ---------------------------------------------------------------------
  derived:

    # De-identified copy held inside Orthanc until group-orthanc has pulled
    # it. onGrouped keys off the processed label that group-orthanc already
    # applies, so this needs no new signal.
    orthancStorage:
      # = Orthanc's StorageDirectory. Used for REPORTING disk usage; reclaim
      # goes through the backend below, because Orthanc names files by UUID and
      # a directory walk cannot map them back to sessions.
      location: /data/orthanc-storage
      # HOW this stage is reclaimed. filesystem walks the location; orthanc-rest
      # asks Orthanc for studies carrying ingest.orthancGroup.processedLabel and
      # deletes them through its API. Replacing the de-identifier means changing
      # this word (or pointing location at the new store), not rewriting the
      # engine.
      backend: orthanc-rest      # filesystem | orthanc-rest
      reclaim: onGrouped         # never | onGrouped
      minAge: 7d
      # Orthanc's own recycler, independent of the rules above. 0 disables
      # it. Leave it off so this dataPolicy block is the only thing in the
      # system that removes anything.
      maximumStorageSizeMB: 0
      maximumPatientCount: 0

    # Hardlinks into Orthanc storage; reclaiming one leaves the bytes intact
    # while any other link survives.
    # CAUTION: `assign --loop` rebuilds its work list from a live directory
    # listing every pass — reclaim: never with no marker means it re-assigns
    # the same sessions forever. onAssigned uses a processed-marker state
    # dir, so 'never' stays genuinely usable.
    grouped:
      location: /data/grouped
      # NO minAge HERE, deliberately. `assign --unlink-source all` deletes each
      # grouped tree at assign time, so a window measured from assign can never
      # elapse — there is nothing left to wait on. What reaches the engine is
      # only an ORPHAN: a tree assign copied but failed to unlink (crash, OOM,
      # eviction). Those are cleaned up immediately; delaying an orphan buys
      # nothing, since its bytes are still in Orthanc storage and the facility
      # backup. Setting minAge here is rejected at render rather than ignored.
      reclaim: onAssigned        # never | onAssigned (orphan cleanup)

    # Output of assign; input to whichever upload mode is enabled.
    assigned:
      location: /data/assigned
      reclaim: auto        # never | onUploaded
      # As above: a recovery window after upload, not a delay before it.
      minAge: 0


    # Where the xnat-ingest deidentify stage writes, and what `upload` reads when
    # ingest.deidentify.enabled. Rendered as a stage ONLY when that is on.
    #
    # WHY: without a row this tree is invisible to the engine, so it is absent
    # from stage_report and therefore from the disk-low alert. It is the tree
    # that grows once de-identification is on, so it was exactly the one disk
    # reporting could not see.
    #
    # CAUTION: report only by default. In upload.mode=s3 the uploader's own
    # rm -rf happens to clear it, and in direct mode nothing does, so a reclaim
    # condition here would be either redundant or unsatisfiable.
    deidentified:
      # No `location` key on purpose. The path is DERIVED from
      # edge.uploadSourceDir, the same helper upload.yaml uses for its argument,
      # so the stage and the uploader cannot end up pointed at different trees.
      # Restating it here would also declare a path that does not exist in a
      # render with de-identification off.
      # OPTION: onUploaded is satisfiable here under BOTH upload modes now. Under
      # s3 the s3-uploader writes the marker; under direct the stagedReclaimer
      # CronJob below confirms the session against XNAT instead. It stays `never`
      # by default because deleting the de-identified copy is a site policy call,
      # not a technical one: this is the last copy on the edge once the originals
      # have been reclaimed.
      # CAUTION: only meaningful under deid.engine=ingest. Under Orthanc-deid the
      # terminal tree is /data/assigned and the chart fails the render rather than
      # let this read as though something were watching this one.
      reclaim: auto             # never | onUploaded
      minAge: 0
    # Central S3 staging prefix. Owned by charts/mgmt (it lives in SeaweedFS,
    # not on this node) but configured here so a site has ONE data policy.
    #
    # NOTE: onXnatConfirmed is not something xnat-ingest does for us — it has
    # no S3 retention at all, which is why staged sessions accumulate and are
    # re-listed every loop. charts/mgmt implements the reclaimer.
    # -----------------------------------------------------------------
    # TERMINAL-STAGE RECLAIMER (upload.mode=direct only)
    # -----------------------------------------------------------------
    # Under direct upload there is no bucket and no s3-uploader, so nothing
    # writes the `uploaded` marker that onUploaded waits for. Without this the
    # terminal tree (/data/assigned, or /data/deidentified under ais-deid)
    # grows forever and no data policy can reach it.
    #
    # Runs the same reclaim-staged.sh as the tier-2 bucket reclaimer, with
    # STORAGE=filesystem. It does not re-decide WHETHER to reclaim: that stays
    # with assigned.reclaim / deidentified.reclaim above, whichever the deid
    # engine makes terminal. Set that one to `never` and this does not render.
    stagedReclaimer:
      # Hourly. The uploader deletes on its own success within seconds; this is
      # the slower, sure path for whatever that missed.
      schedule: "17 * * * *"
      # OPTION: raise on a slow link. A session still uploading is protected by
      # the XNAT check regardless, so this is about noise, not safety.
      minAge: 1d
      # Ask XNAT whether it holds the session, complete, before deleting the
      # only remaining copy. Off means trusting local state alone.
      # CAUTION: `false` removes the last independent check before deletion.
      verifyAgainstXnat: true
      # Ceiling per run. A bug that decides everything is reclaimable removes
      # this many and stops, leaving the rest to inspect.
      maxRemovals: 50
      # Killed if a run hangs on an unreachable XNAT, before the next is due.
      deadlineSeconds: 3000
      resources:
        requests: {cpu: 20m, memory: 64Mi}
        limits: {memory: 256Mi}
    s3Staged:
      reclaim: onXnatConfirmed   # never | onXnatConfirmed
      minAge: 1d
      # Re-query XNAT for the session before removing the staged copy rather
      # than trusting the uploader's exit code. Slower, and correct.
      verifyAgainstXnat: true

  # ---------------------------------------------------------------------
  # TELEMETRY — contains no patient data. Tune freely for disk.
  # ---------------------------------------------------------------------
  telemetry:
    # LOKI AND PROMETHEUS RETENTION ARE NOT SET HERE. They live in their own
    # subchart values, because Helm cannot template a subchart's values from
    # this file and install.sh deliberately uses no --set. Declaring them here
    # too produced two keys that read exactly like policy and did nothing —
    # an operator could edit them, see a clean install, and keep the old
    # retention indefinitely with nothing to say so.
    #
    # TO CHANGE RETENTION, EDIT THESE INSTEAD (in sites/<site>/values.yaml):
    #
    #   Prometheus:                       Loki:
    #     kube-prometheus-stack:            loki:
    #       prometheus:                       loki:
    #         prometheusSpec:                   limits_config:
    #           retention: 15d                    retention_period: 30d
    #
    # Setting loki/prometheus under telemetry is rejected at render, so the
    # mistake cannot be silent again.
    #
    # podLogFiles stays: it has no counterpart anywhere. Nothing implements it
    # yet — on-node pod log rotation is a kubelet setting and would be wired in
    # scripts/06-join-edge-worker.sh.
    # ON-NODE POD LOG ROTATION, enforced by the kubelet on each edge worker.
    #
    # NOT a duration, and that is the kubelet's constraint rather than a choice.
    # It rotates container logs by SIZE and COUNT (containerLogMaxSize /
    # containerLogMaxFiles) and has no time-based retention at all — there is no
    # "delete logs older than N days" setting to wire a duration to.
    #
    # This key used to read `retain: 14d`, which nothing implemented and nothing
    # could: it promised a time window the kubelet cannot express. Stating the
    # bound the kubelet actually enforces is the honest version — total on-disk
    # log per container is maxSize x maxFiles, so 10Mi x 5 = 50Mi.
    #
    # Applied by scripts/06-join-edge-worker.sh via --kubelet-extra-args when the
    # worker is installed. CAUTION: it is a JOIN-TIME setting, so changing it
    # affects workers joined afterwards; an existing node needs its k0s worker
    # service reinstalled to pick it up.
    #
    # THAT NO-OP IS CHECKED, not merely documented. `make verify-live` compares
    # this against each node's running kubelet config and FAILS on a mismatch.
    podLogFiles: {maxSize: 10Mi, maxFiles: 5}


# =============================================================================
# 2. storage
# =============================================================================
storage:
  storageClass:
    # false on k0smotron child clusters and anywhere a provisioner already
    # exists. StorageClass is cluster-scoped, so two releases both creating
    # it in one cluster will collide.
    create: true
    name: hostpath-pipeline

  # The working volume: orthanc-storage/, grouped/, assigned/, incoming/,
  # LOGS/, tmp/. All stages MUST share one filesystem or hardlink_or_copy
  # silently degrades to a full copy (cross-device link -> EXDEV).
  pipeline:
    hostPath: /data/xnat-ingest
    capacity: 1500Gi

  # The archive of record, deliberately a SEPARATE volume from the pipeline
  # one: a wedged or full pipeline volume must not be able to take the
  # originals with it, and the two have completely different retention.
  facilityBackup:
    enabled: true
    hostPath: /data/facility-backup
    capacity: 2000Gi

  # Both volumes are created with Retain + helm.sh/resource-policy: keep, so
  # `helm uninstall` cannot remove received DICOM. Removing the data is a
  # separate, deliberate operation.
  reclaimPolicy: Retain


# =============================================================================
# 3. orthanc — DICOM receiver + de-identification
# =============================================================================
orthanc:
  enabled: true
  # Disable the managed receiver to use an existing facility Orthanc.
  externalUrl: ""
  storageDirectory: /data/orthanc-storage
  image:
    repository: jodogne/orthanc-plugins
    tag: "1.12.11"
    pullPolicy: IfNotPresent

  aet: AISEDGE
  dicomPort: 4242
  httpPort: 8042

  # How long a study must be silent before OnStableStudy fires and the
  # xnat-ingest-ready label is applied. LOAD-BEARING: with no StableAge the
  # label is never applied, group-orthanc filters everything out, and the
  # pipeline stalls with data sitting in Orthanc and no error anywhere.
  stableAge: 30

  # hostPort  — bind 4242 on the node IP. Standard DICOM port; modalities are
  #             painful to repoint, so this is the default. Pins the pod to
  #             one node, which is fine for a single-node edge.
  # nodePort  — expose via NodePort instead.
  # both      — both, for a migration window.
  expose:
    dicom: hostPort
    nodePorts:
      dicom: 30042
      http: 30842
    # ClusterIP keeps the REST API in-cluster only. Do not expose it without
    # auth.enabled.
    http: ClusterIP

  auth:
    # Orthanc's REST API can delete studies. Our old config ran with
    # AuthenticationEnabled: false and was protected only by the accident of
    # being ClusterIP-only.
    enabled: true
    #
    # THREE keys, not two. The Secret is consumed by three different things:
    #
    #   users.json        mounted INTO the Orthanc configuration directory, at
    #                     /etc/orthanc/users.json. It is not a credentials file
    #                     in a format of our own: it is an Orthanc CONFIG
    #                     FRAGMENT, and must be exactly
    #                       {"RegisteredUsers":{"admin":"<password>"}}
    #                     Orthanc scans /etc/orthanc and merges every .json it
    #                     finds, which is how these users reach it. Its own
    #                     startup log names both files:
    #                       Reading the configuration from: /etc/orthanc/orthanc.json
    #                       Reading the configuration from: /etc/orthanc/users.json
    #                     The password is PLAINTEXT inside that JSON, which is
    #                     why this Secret belongs in secrets.enc.yaml and is
    #                     SOPS-encrypted at rest.
    #   orthanc-user      read by group-orthanc, which lists and labels studies,
    #   orthanc-password  and by the data-policy engine, which reclaims the
    #                     Orthanc store over the same REST API whenever
    #                     dataPolicy.derived.orthancStorage.backend is
    #                     orthanc-rest. Both take them from HERE, so the two
    #                     cannot present different credentials to one Orthanc.
    #                     If they do not match the user in users.json, Orthanc
    #                     answers 401: group-orthanc crash-loops, and the store
    #                     reclaim finds nothing to do.
    #
    # THERE IS NO "RegisteredUsersFile" OPTION IN ORTHANC, and an earlier version
    # of this comment said there was. The config carried that key, Orthanc
    # ignored it silently, registered NO users, and with AuthenticationEnabled
    # true refused EVERY request including correct credentials. It was never a
    # mounting problem and no path would have fixed it. MEASURED on
    # jodogne/orthanc-plugins:1.12.11, two containers identical but for the
    # mechanism:
    #     RegisteredUsersFile:          authenticated=401 anonymous=401
    #     users.json in the config dir: authenticated=200 anonymous=401
    # If you are reading this because you saw a 401, check that users.json is
    # mounted inside /etc/orthanc and that its password equals orthanc-password.
    existingSecret: orthanc-credentials

  # Rewriting pixel data at receive time happens BEFORE the Lua hook runs, so
  # the facility backup would hold the transcoded copy rather than the wire
  # original. Leave empty whenever deid + facilityBackup are on.
  ingestTranscoding: ""
  dicomScuTimeout: 60

  plugins:
    - /usr/local/share/orthanc/plugins/libOrthancExplorer2.so
    - /usr/local/share/orthanc/plugins/libStoneWebViewer.so
    - /usr/local/share/orthanc/plugins/libOrthancDicomWeb.so
    - /usr/local/share/orthanc/plugins/libOrthancGdcm.so

  # ---------------------------------------------------------------------
  # De-identification (our Lua hook — NOT xnat-ingest --deidentify, which is
  # non-functional for DICOM in 0.12.x).
  #
  # On each stored instance the hook: writes the original to the facility
  # backup, applies the profile via Orthanc /modify, deletes the original and
  # keeps the de-identified copy. On a stable study it applies the
  # xnat-ingest-ready label that group-orthanc filters on.
  # ---------------------------------------------------------------------
  deid:

    # Salt for the subject/session pseudonym hashes. Changing it re-links
    # every pseudonym, so existing XNAT subjects stop matching new arrivals.
    # Preserve it across reinstalls; never rotate casually.
    existingSaltSecret: orthanc-deid-salt   # key: AIS_DEID_HMAC_SALT

    # AE title -> XNAT project. THE routing table. An AE title that is not
    # listed here is quarantined under the facility backup, not discarded.
    # Keep project IDs within [A-Za-z0-9_]: assign normalises to that set.
    aetMap: {}
    #  SIEMENS_3T_AET: {project: MYSITE_RESEARCH}
    #  BRUKER_PET_AET: {project: MYSITE_PET}

    # Passed verbatim to Orthanc /modify. Copy from
    # files/deidentification-profile.example.json and edit to your policy.
    profile: {}

  podSecurityContext:
    fsGroup: 10001
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
  securityContext:
    capabilities:
      drop: [ALL]
    allowPrivilegeEscalation: false
  resources:
    requests: {memory: 512Mi, cpu: 200m}
    limits:   {memory: 2Gi,   cpu: "1"}
  probes:
    liveness:  {initialDelaySeconds: 30, periodSeconds: 10}
    readiness: {initialDelaySeconds: 15, periodSeconds: 5}


# =============================================================================
# 4. ingest — group -> assign
# =============================================================================
ingest:
  image:
    repository: ghcr.io/australian-imaging-service/xnat-ingest
    tag: "0.15.6"
    pullPolicy: IfNotPresent

  # Stanford routing and raw-file ingestion use the current xnat-ingest image.
  stanford:
    enabled: false
    fallbackProject: misc
    routing:
      enabled: true
      field: PatientID
      visitFields: [AccessionNumber, StudyID, StudyInstanceUID]
      autoImportUnlabeled: false
      requireMatch: false
      batchSize: 10
      allowedProjects: []
    rawUploads:
      enabled: false
      hostPath: /local/samba/public/xnat-upload
      archiveHostPath: /local/samba/public/xnat-upload-done
      waitPeriod: 60
      visit: samba_upload
      scan: 1.SambaUpload
      resource: FILES
      modality: MR
      # Empty admits every raw project independently of the DICOM allow-list.
      allowedProjects: []
    excludeDicomScanTypes: [PhoenixZIPReport]

  # One JSON object per log line. The alert rules and dashboards parse these
  # fields directly; turning this off breaks monitoring, not just formatting.
  logFormat: json

  # Pull labelled studies out of Orthanc and group them into sessions.
  orthancGroup:
    enabled: true
    interval: 60
    # Only studies carrying this label are pulled. Applied by the Lua hook
    # after de-identification, which is what makes the label the gate that
    # stops identifiable data leaving Orthanc.
    toProcessLabel: xnat-ingest-ready
    processedLabel: xnat-ingest-processed
    waitPeriod: 60
    copyMode: hardlink_or_copy

  # Second ingest path: a watched directory instead of a DICOM modality.
  # OFF by default — see dataPolicy.originals.fileDrop for why this path
  # deserves more care than the Orthanc one.
  fileDrop:
    enabled: false
    interval: 300
    inputGlob: "/data/incoming/**/*"
    waitPeriod: 60
    datatypes: "medimage/dicom-series"
    copyMode: hardlink_or_copy

  # Derive project/subject/session from the DICOM tags the Lua hook writes.
  # routing.json's AETMap is the single source of truth for project; there is
  # no hardcoded project ID anywhere.
  assign:
    interval: 60
    copyMode: hardlink_or_copy
    # THESE FOLLOW deid.engine. Under the default `ingest` the Lua hook does not
    # modify instances, so nothing writes the ClinicalTrial* tags and assign must
    # read tags the modality itself populates. The chart refuses to render if
    # ClinicalTrial* is named while the engine is ingest.
    #
    # CAUTION: `subject` becomes the XNAT subject label, and assign runs BEFORE
    # deidentify. PatientID here means the medical record number becomes that
    # label in the clear. Point it at a pseudonym tag if your modality writes one.
    # DERIVED FROM deid.engine. Leave it empty and the chart names the triple
    # that engine actually populates:
    #
    #   orthanc  ClinicalTrialProtocolID / ClinicalTrialSubjectID /
    #            ClinicalTrialTimePointID, written by the Lua hook from the AET
    #            map. NOT a site decision under this engine: the hook always
    #            writes them, and the chart already refuses to render if the
    #            profile does not.
    #   ingest   StudyID / PatientID / AccessionNumber, tags a modality
    #            populates itself, because with the hook off nothing writes the
    #            ClinicalTrial* triple.
    #
    # WHY IT IS DERIVED RATHER THAN FIXED. A fixed default is wrong for one
    # engine whichever one it names, and both mistakes have been made here. It
    # was the ClinicalTrial* triple, which filed every ingest-engine study under
    # __invalid__ still carrying its PHI. It was then changed to the modality
    # tags, which is where this ended up: MEASURED on a fresh tier-1 install,
    # 531 instances staged as
    #   assigned/A9BB5B6D36EE.test_project-0A326BB4F373.A9BB5B6D36EE
    # because the orthanc profile rewrites StudyID to ${SessionHash}, and the
    # uploader then failed every pass with "Project 'A9BB5B6D36EE' does not
    # exist on XNAT".
    #
    # SET IT ONLY IF YOUR MODALITIES CARRY THE IDS SOMEWHERE ELSE, which is a
    # real case under deid.engine=ingest: the radiographer enters these at the
    # console, so CAI uses ReferringPhysicianName for project and PatientID for
    # subject, and other sites use StudyComments or StudyDescription. Whatever
    # is named is checked against the engine at render time, in both directions.
    #
    # WHAT IT COSTS TO KNOW: whatever is named here becomes the XNAT SUBJECT
    # LABEL verbatim. assign reads it and files the session BEFORE deidentify
    # runs, so no recipe can rename it afterwards. De-identification still works
    # on the file contents; it just cannot reach the label. Switching engines
    # changes the shape of that label, so see the migration note in
    # docs/components/deidentification.md before moving an existing site.
    #
    # CAUTION: under deid.engine=ingest, subject: PatientID means the medical
    # record number becomes that label in the clear. Point it at a pseudonym tag
    # if your modality writes one. Hashing at this step is a known second-pass
    # item, not an oversight.
    tagMapping: {}

  # DE-IDENTIFICATION ENGINE 2 OF 2 — xnat-ingest's own, OFF by default.
  #
  # The default engine is the Orthanc Lua hook (orthanc.deid above), which
  # strips each instance as it arrives. This one runs as its own stage between
  # assign and upload instead. Pick ONE; the chart refuses both.
  #
  # CAUTION: THIS ENGINE GIVES UP AE-TITLE ROUTING. Mapping a calling AE title
  # to a project is an Orthanc Lua feature (orthanc.deid.aetMap). This stage
  # never sees the AE title, so with the hook off there is no way to derive the
  # project from which machine sent the study. Your modalities must populate
  # project/subject/session in tags they actually send, and ingest.assign
  # .tagMapping must point at those tags. The chart derives them from the engine,
  # so under this one it names StudyID / PatientID / AccessionNumber rather than
  # the ClinicalTrial* triple only the Lua hook writes, and it refuses an
  # explicit mapping that names the triple. What it cannot detect is a mapping
  # that names real tags this site's modalities do not populate, which looks
  # correct and ends with every study in __invalid__ still carrying its PHI.
  #
  # AND THE TAGS YOU NAME BECOME THE XNAT LABELS, VERBATIM. assign lifts the
  # values out before this stage runs, and ImagingSession.new_empty copies them
  # into the de-identified session unchanged, so no recipe can alter them. Under
  # the Lua hook they are already pseudonyms (salted djb2, not an HMAC despite
  # the salt's name); here they are whatever the
  # modality sent. Pointing subject at PatientID puts the raw medical record
  # number into XNAT while the headers and pixels are correctly stripped. Choose
  # tags that are already pseudonymous at the modality.
  #
  # WHEN TO PREFER THIS ONE. It writes a re-identification mapping per session,
  # so the process can be reversed later (a clinical follow-up needing to find
  # the original scan). The Lua hook is one-way by design and cannot do that.
  #
  # WHAT IT COSTS. Identifiable data passes through group and assign before it
  # is cleaned, so it exists on the pipeline volume for longer and in more
  # places. The Lua hook cleans at the front door and everything downstream only
  # ever sees stripped data. That is why the Lua hook stays the default.
  #
  # The reid mapping is the sensitive part: it is the map BACK to the identities
  # that were removed. Set reidEncryptKeySecret and keep that key somewhere
  # other than the volume the mappings are written to.
  deidentify:
    interval: 60
    copyMode: hardlink_or_copy
    # THE RECIPES. Written here, in the site file, exactly like
    # orthanc.deid.profile — the chart builds the ConfigMap and mounts it, so a
    # fresh install needs no kubectl and no pre-existing namespace.
    #
    # Key is the path under SPEC_DIR, value is the recipe:
    #
    #   specs:
    #     "__default__/medimage/dicom-series": |
    #       FORMAT dicom
    #
    #       %header
    #
    #       REMOVE PatientName
    #       REMOVE PatientBirthDate
    #
    # A ConfigMap key cannot contain '/' or '@' and a ConfigMap mounts flat, so
    # the chart sanitises each path into a legal key and maps it back with
    # items[].path on the volume. That is entirely internal: write the real
    # paths here and ignore the restriction.
    specs: {}

    # ALTERNATIVE, for a ConfigMap you manage yourself (sealed-secrets, an
    # external pipeline, recipes too large to sit in the site file). Set both,
    # and specs above must be empty. specFiles maps <ConfigMap key> -> <path
    # under SPEC_DIR>, doing by hand what specs does automatically.
    specConfigMap: ""

    # KUBERNETES CANNOT STORE THESE FILENAMES DIRECTLY. A ConfigMap key is
    # restricted to [-._a-zA-Z0-9], so the '@' xnat-ingest needs is illegal,
    # and a ConfigMap mounts flat, so the per-project directory would be lost
    # too. Both are fixed by mapping each key to the path it must appear at,
    # which is why this cannot be built with `kubectl create configmap
    # --from-file` alone.
    #
    #   specFiles:
    #     default-dicom-series: "__default__/medimage/dicom-series"
    #     myproject-dicom-series: "MYPROJECT/medimage/dicom-series"
    specFiles: {}

    # Optional. A URL-safe base64 32-byte key (cryptography's
    # Fernet.generate_key()). Set, mappings are written encrypted as
    # <session>.json.enc and are unreadable without it. Unset, they are plain
    # JSON on the same volume as the data they de-identify.
    reidEncryptKeySecret: ""       # key: XINGEST_REID_ENCRYPT_KEY

  # Attach Siemens side files (twix / rda / puls) to an assigned session.
  # Idle `sleep infinity` when there are none, so off unless needed.
  associate:
    enabled: false
    datatypes: "medimage/vnd.siemens.syngo-mr.xa.twix;medimage/vnd.siemens.syngo-mr.xa.rda;medimage/vnd.siemens.syngo-mr.xa.puls"
    copyMode: hardlink_or_copy


# =============================================================================
# 5. upload — how sessions reach XNAT
# =============================================================================
# s3     edge -> central S3 (SeaweedFS) -> mgmt uploader -> XNAT.
#        Central buffering and retry, one XNAT credential for the whole
#        fleet, and the edge never needs to reach XNAT. Needs charts/mgmt.
#
# direct edge -> XNAT. No management plane, no S3, no CA plumbing. This is
#        the tier-1 / standalone-site path.
#
# The two are mutually exclusive: both enabled means every session is
# uploaded twice. The chart refuses to render if you set both.
# -----------------------------------------------------------------------------
upload:
  mode: s3

  s3:
    endpoint: ""                       # https://seaweedfs.<domain>
    # THIS SITE'S OWN staging bucket. The management chart names them
    # ingest-<edge name> by default, and scopes this edge's S3 identity to
    # exactly this bucket — SeaweedFS enforces actions per BUCKET, with no
    # prefix-level scoping, so a shared bucket means every site can read and
    # delete every other site's staged imaging. Must match the name the
    # management chart derived for this site.
    bucket: ""   # e.g. ingest-edge-dev
    prefix: staged
    region: us-east-1                  # SeaweedFS ignores it; SigV4 signs over it

    # No addressing-style key here on purpose: rclone's s3 backend defaults
    # force_path_style=true and keeps it true for provider=SeaweedFS —
    # measured, the request URL comes out path-style
    # (https://<endpoint>/<bucket>?…), which the single-SAN cert needs. A
    # values entry for it could only turn that off.

    existingSecret: s3-edge-credentials  # keys: access-key, secret-key

    # PEM holding the CA that signed the SeaweedFS server certificate.
    # CAUTION, and it changed with the client: an EMPTY AWS_CA_BUNDLE did not
    # fall back to the system trust store — it disabled certificate
    # verification entirely, silently (measured: a request to a hostname the
    # cert does not cover succeeded anyway). RCLONE_CA_CERT="" is NOT that
    # trap — measured on rclone 1.75.0, empty behaves as unset and still
    # verifies against the system store. Do not let it render empty regardless:
    # against a privately-signed SeaweedFS that is a failed handshake on every
    # transfer instead of a silent downgrade. The chart still refuses to render
    # an https endpoint with no CA configured.
    caBundleSecret: ca-bundle
    caBundleKey: ca.crt

    # ---- mTLS: THIS SITE'S OWN IDENTITY ON THE UPLOAD PATH -----------------
    # INDEPENDENT OF caBundleSecret ABOVE, and the two are easy to confuse:
    #   caBundleSecret    who WE trust — the CA that signed the SeaweedFS
    #                     server certificate. May legitimately be empty on
    #                     cloud, where that certificate can come from a public
    #                     CA already in the system trust store.
    #   clientCertSecret  who WE ARE — a certificate signed by the fleet's own
    #                     CA and delivered by the management cert-sync CronJob.
    #                     Never comes from a public CA, on any topology.
    # Setting one has no bearing on the other.
    #
    # Mirrors observability.loki.push.requireAuth on the management side. Ships
    # OFF: the certificate is delivered by cert-sync, the mount below is NOT
    # optional (a silent start with no identity is the failure this prevents),
    # and a site that turns this on before its Secret has landed gets an
    # uploader stuck in CreateContainerConfigError.
    # CAUTION: the management half is a separate flag —
    # seaweedfs.ingress.clientCerts.require. Turn THIS on first; presenting a
    # certificate nobody asks for is harmless, being asked for one you do not
    # have is not — measured, that is an HTTP 400 whose body rclone reports as
    # an S3 XML parse error, so the logs name neither certificates nor auth.
    requireClientCert: false
    # kubernetes.io/tls — keys tls.crt / tls.key, fixed by Kubernetes. Must
    # match the certSync destination in the MANAGEMENT site values.
    clientCertSecret: s3-client-tls

    # THE S3 CLIENT. rclone, replacing amazon/aws-cli:2.31.19.
    #
    # PINNED to an exact release, like every other image here. `latest` on this
    # one is worse than most: rclone ships roughly monthly and its S3 backend
    # defaults (force_path_style, checksum headers, per-provider quirks) are
    # the part this deployment depends on.
    # 1.75.0 is the current stable release; verified end to end against the
    # SeaweedFS 4.34 this fleet pins.
    #
    # CAUTION: this image is Alpine, and the uploader loop does NOT run in it —
    # see shell.image below before changing either.
    image:
      repository: rclone/rclone
      tag: "1.75.0"
      pullPolicy: IfNotPresent

    # THE USERLAND THE LOOP RUNS IN — not an S3 client, despite the name of the
    # repository. files/s3-uploader.sh needs bash, GNU findutils (`find -L
    # -printf`, `find -xtype l`) and GNU coreutils (`du -sb`, `md5sum`).
    # rclone/rclone is Alpine and has none of them: MEASURED there, the pod
    # cannot even start (no /bin/bash), and if it could, fingerprint() would
    # return the md5 of an empty string for every session and the
    # dangling-symlink guard would never fire — both silent. The busybox
    # userland is what the migration off `minio/mc` was partly about
    # (docs/components/mc.md, "A full userland"); this is not a wall worth
    # walking into a second time.
    #
    # So upload.yaml runs the loop here and stages the rclone binary in from
    # image above with an initContainer. rclone is a static Go binary, so it
    # runs in this glibc image unchanged.
    #
    # amazon/aws-cli:2.31.19 specifically, and NOT because anything still calls
    # `aws`: it is the image this loop already ran in, so the userland the
    # script is proven against does not change at all, and it is already
    # present on every edge node and already pinned twice elsewhere in this
    # repo — no new pull on upgrade, which matters on constrained sites. Any
    # bash + GNU-coreutils image would do; swapping it is a userland change and
    # deserves the same measurement the note above records.
    shell:
      image:
        repository: amazon/aws-cli
        tag: "2.31.19"
        pullPolicy: IfNotPresent
    transfers: 4
    bandwidthLimit: ""
    interval: 60
    # Don't touch a session until it has been quiet this long — assign may
    # still be writing into it.
    settleMinutes: 5
    resources:
      requests: {memory: 128Mi, cpu: 100m}
      limits:   {memory: 512Mi, cpu: 500m}

  direct:
    replicas: 1
    existingSecret: xnat-credentials    # keys: server, username, password
    # Poll interval. Every other stage runs at 60, upload.s3.interval and
    # charts/mgmt's xnatUpload.loop included, so a large value here is the whole
    # delivery latency on a direct site. It is also NOT the only wait: a session
    # touched within waitPeriod is skipped for the WHOLE next cycle, so the
    # worst case is loop + waitPeriod, not loop.
    loop: 120
    waitPeriod: 60
    alwaysInclude: "all"
    verifySsl: true
    requireManifest: false
    checkChecksums: false
    tempDir: /data/tmp
    resources:
      requests: {memory: 256Mi, cpu: 100m}
      limits:   {memory: 1Gi,   cpu: "1"}


# =============================================================================
# 6. samba — optional SMB drop-box
# =============================================================================
samba:
  enabled: false
  image:
    repository: dockurr/samba
    # 4.23.10, not 4.23.5: closes two unauthenticated RCEs that reach a
    # standalone smbd (CVE-2026-4480 printing, CVE-2026-4408 DCE/RPC SAMR)
    # plus CVE-2026-1933/2340/58224. Latent while enabled:false above, but
    # the site that flips it on binds 445 on a hospital network — the worst
    # place to meet an unauthenticated smbd RCE.
    tag: "4.23.10"
    pullPolicy: IfNotPresent
  shareName: edge
  # Only this subdirectory is exported. Sharing the volume root would put
  # orthanc-storage/ (DICOM), grouped/, assigned/ and LOGS/ on the share.
  subPath: incoming
  existingSecret: samba-credentials     # keys: username, password
  # Binds 445 on the node, so it conflicts with any smbd already running
  # there. Check before enabling.
  hostPort: 445
  resources:
    requests: {memory: 256Mi, cpu: 100m}
    limits:   {memory: 512Mi, cpu: 500m}


# =============================================================================
# 7. observability — ship logs to the management cluster
# =============================================================================
# Off for standalone sites. On for tier-2, where the mgmt cluster runs Loki,
# Grafana and Alertmanager.
observability:
  enabled: false
  vector:
    image:
      repository: timberio/vector
      tag: "0.49.0-distroless-libc"
      pullPolicy: IfNotPresent
    resources:
      requests: {memory: 128Mi, cpu: 100m}
      limits:   {memory: 512Mi, cpu: 500m}
  loki:
    endpoint: ""                        # https://loki.<domain>
    # This edge's CLIENT CERTIFICATE for the management Loki push endpoint —
    # kubernetes.io/tls (tls.crt/tls.key), written here by the management
    # cert-sync CronJob. Not created here; rotates without touching the site.
    # CAUTION: must match the certSync destination in the MANAGEMENT site
    # values, or Vector sits in CreateContainerConfigError (loud on the edge,
    # invisible from mgmt). Replaces a Basic-auth path that never actually
    # authenticated anything — docs/hardening-decisions.md §1.
    clientCertSecret: loki-push-client-tls
    caBundleSecret: ca-bundle
    caBundleKey: ca.crt


# =============================================================================
# 8. platform
# =============================================================================
serviceAccounts:
  create: true
  # Nothing in this chart talks to the Kubernetes API except Vector, which
  # gets its own ServiceAccount and RBAC.
  automountToken: false

# onprem only: pin management hostnames to the mgmt node IP inside pods,
# because edge nodes generally cannot resolve them via site DNS.
hostAliases:
  enabled: true
  mgmtNodeIP: ""
  hostnames: []

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
