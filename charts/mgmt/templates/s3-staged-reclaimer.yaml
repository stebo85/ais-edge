{{- /*
S3 staging reclaimer — dataPolicy.derived.s3Staged.

The uploader Deployment next door (xnat-upload.yaml) reads
s3://<bucket>/<prefix> and pushes into XNAT, but `xnat-ingest upload` has no
retention of its own: it rebuilds its work list from a live listing every
--loop pass, so a delivered session stays in the bucket, is listed again,
"uploaded" again and re-fires XNATUploadSuccess forever, while staging grows
without bound. This CronJob is the only thing that deletes from staging.

reclaim: never renders NOTHING — not a suspended CronJob, not an empty
ConfigMap. A site that has opted out of reclaiming should have no object in
the cluster that could later be resumed by accident.
*/ -}}
{{- $s3staged := .Values.dataPolicy.derived.s3Staged }}
{{- if ne $s3staged.reclaim "never" }}

{{- /* The reclaimer borrows the uploader's namespace and both of its Secret
       refs: it must talk to exactly the same bucket with the same identity,
       and ask the same XNAT. Reclaiming with a different S3 or XNAT identity
       than the one that delivered the data is how you end up confirming
       against the wrong server and deleting the right sessions. */ -}}
{{- if not .Values.xnatUpload.enabled }}
  {{- fail "dataPolicy.derived.s3Staged.reclaim is set but xnatUpload.enabled=false. The reclaimer lives in the uploader's namespace and uses its xnatSecretRef/s3SecretRef; with the uploader off there is nothing delivering the staged sessions it would be reclaiming. Set reclaim: never." }}
{{- end }}
{{- if not .Values.seaweedfs.enabled }}
  {{- fail "dataPolicy.derived.s3Staged.reclaim is set but seaweedfs.enabled=false. Removal goes through the SeaweedFS filer HTTP API in this release's own namespace; with SeaweedFS off there is no filer to call. Set reclaim: never." }}
{{- end }}

{{- /* One image, and it is one we already pin. The reclaimer needs an
       authoritative S3 listing (aws), the XNAT REST confirmation (curl) and
       the filer delete (curl) — amazon/aws-cli ships all of it, so there is
       no custom image to build and nothing extra to keep patched.

       This used to need kubectl too, because the only known way to remove a
       SeaweedFS directory ENTRY was `weed shell fs.rm -r` inside the
       SeaweedFS pod. The filer's HTTP API does the same thing
       (DELETE ...?recursive=true, measured: 204 and the entry is gone), which
       removed the kubectl dependency, the custom image AND the pods/exec RBAC
       this job used to require. A CronJob that can open a shell in any pod in
       the namespace is a much larger blast radius than one that can call a
       single HTTP verb. */ -}}
{{- $root := . }}
{{- range $edge := .Values.edges }}
{{- $bucket := include "mgmt.edgeBucket" (list $root $edge) }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mgmt.fullname" $root }}-reclaim-{{ $edge.name }}
  namespace: {{ $root.Values.xnatUpload.namespace }}
  labels:
    {{- include "mgmt.labels" $root | nindent 4 }}
data:
  {{- /* .Files.Get, never inline: the script is full of ${...}, backticks and
         JMESPath, and keeping it a real file is what lets `bash -n` lint it
         in CI and lets it be run against mocks. */}}
  reclaim-staged.sh: |
    {{- $root.Files.Get "files/reclaim-staged.sh" | nindent 4 }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "mgmt.fullname" $root }}-reclaim-{{ $edge.name }}
  namespace: {{ $root.Values.xnatUpload.namespace }}
  labels:
    {{- include "mgmt.labels" $root | nindent 4 }}
    app: xnat-ingest
    component: s3-reclaimer
spec:
  schedule: {{ $root.Values.dataPolicy.derived.s3Staged.schedule | quote }}
  # Two reclaimers listing and deleting the same prefix concurrently would
  # each confirm a session the other is mid-way through removing. Forbid, not
  # Replace: killing a run between `fs.rm -r` and the verification listing
  # would lose the record of what was deleted.
  concurrencyPolicy: Forbid
  # If the controller was down at the scheduled minute, run late rather than
  # skipping — but do not let a queue of missed runs pile up.
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  # Kept deliberately: a failed reclaim is the pod whose logs an operator
  # needs, and the JSON `reclaim_kept` reasons only exist in them.
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      labels:
        {{- include "mgmt.labels" $root | nindent 8 }}
    spec:
      # No retries. Every decision is re-derived from a live listing on the
      # next scheduled run anyway, so a retry buys nothing and a retry loop
      # would hammer the XNAT REST API on a bad day.
      backoffLimit: 0
      # Shorter than the hourly default schedule: a run hung on a wedged filer
      # must be reaped before the next one is due, or Forbid silently
      # skips every subsequent run.
      activeDeadlineSeconds: {{ $root.Values.dataPolicy.derived.s3Staged.deadlineSeconds | int }}
      template:
        metadata:
          labels:
            {{- include "mgmt.labels" $root | nindent 12 }}
            app: xnat-ingest
            # LOAD-BEARING LABELS. Vector turns these into the Loki stream
            # labels the ruler selects on (namespace / app / component /
            # cluster). Renaming component disables every reclaimer alert
            # and panel silently.
            component: s3-reclaimer
          annotations:
            # Hash the script FILE, so a change to the reclaim logic is
            # visible in `helm diff` even though a CronJob has no rollout.
            checksum/script: {{ $root.Files.Get "files/reclaim-staged.sh" | sha256sum }}
            {{- with $root.Values.podAnnotations }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          {{- include "mgmt.schedulingRules" $root | nindent 10 }}
          containers:
            - name: reclaimer
              image: "{{ $root.Values.dataPolicy.derived.s3Staged.image.repository }}:{{ $root.Values.dataPolicy.derived.s3Staged.image.tag }}"
              imagePullPolicy: {{ $root.Values.dataPolicy.derived.s3Staged.image.pullPolicy | default "IfNotPresent" }}
              # The aws-cli-style images use `aws` as their entrypoint.
              command: ["/bin/bash", "/scripts/reclaim-staged.sh"]
              env:
                - name: CLUSTER_LABEL
                  value: {{ $edge.name | quote }}
                # Deliberately the UPLOADER's bucket and prefix, not
                # seaweedfs.buckets.*: the reclaimer must act on exactly the
                # prefix the uploader reads, and one values key for both is
                # the only way that stays true.
                - name: S3_BUCKET
                  value: {{ $bucket | quote }}
                - name: S3_PREFIX
                  value: {{ $root.Values.xnatUpload.prefix | quote }}
                - name: ARCHIVE_PREFIX
                  value: {{ $root.Values.xnatUpload.archivePrefix | quote }}
                - name: RECLAIM
                  value: {{ $root.Values.dataPolicy.derived.s3Staged.reclaim | quote }}
                - name: MIN_AGE
                  value: {{ $root.Values.dataPolicy.derived.s3Staged.minAge | quote }}
                - name: VERIFY_XNAT
                  value: {{ $root.Values.dataPolicy.derived.s3Staged.verifyAgainstXnat | quote }}
                # Blast-radius cap. A bug that decided "delete everything" is
                # bounded to this many sessions per run, leaving the rest for
                # an operator to notice before they are gone.
                - name: MAX_REMOVALS
                  value: {{ $root.Values.dataPolicy.derived.s3Staged.maxRemovals | quote }}
                # dryRun OR disabled — either one means "decide and log, delete
                # nothing". Note this is deliberately NOT the edge chart's
                # `and .enabled .dryRun`: with dataPolicy.enabled=false that
                # expression yields DRY_RUN=false, i.e. a switched-off data
                # policy that deletes. Nothing that removes patient data
                # should read a disabled policy as permission.
                - name: DRY_RUN
                  value: {{ or (not $root.Values.dataPolicy.enabled) $root.Values.dataPolicy.dryRun | quote }}

                # --- where the filer lives ------------------------------------
                # Only the FILER can remove a directory ENTRY.
                # `aws s3 rm --recursive` deletes the objects and leaves a
                # 0-byte prefix that the uploader still lists as a session —
                # measured on SeaweedFS 3.99, and the cause of two days of
                # duplicate XNATUploadSuccess mail. The filer's HTTP API on
                # :8888 removes it properly, over plain http inside the
                # cluster, with no kubectl and no RBAC.
                - name: FILER_ENDPOINT
                  value: {{ include "mgmt.filerInternalEndpoint" $root | quote }}

                # --- S3 -------------------------------------------------------
                - name: AWS_ENDPOINT_URL
                  value: {{ include "mgmt.s3InternalEndpoint" $root | quote }}
                # SeaweedFS ignores the region; botocore refuses to sign
                # without one.
                - name: AWS_DEFAULT_REGION
                  value: {{ $root.Values.xnatUpload.region | quote }}
                # Path-style addressing is not configured here on purpose: a
                # custom AWS_ENDPOINT_URL already makes botocore resolve with
                # ForcePathStyle=True, and AWS_S3_ADDRESSING_STYLE is a
                # config-FILE key that would be ignored as an env var.
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: {{ $edge.uploadSecretRef | default $root.Values.xnatUpload.s3SecretRef }}
                      key: access-key
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ $edge.uploadSecretRef | default $root.Values.xnatUpload.s3SecretRef }}
                      key: secret-key

                # --- XNAT -----------------------------------------------------
                # The confirmation query. Same Secret as the uploader, so the
                # reclaimer can only ever ask the server the data was sent to.
                - name: XNAT_SERVER
                  valueFrom:
                    secretKeyRef:
                      name: {{ $root.Values.xnatUpload.xnatSecretRef }}
                      key: server
                - name: XNAT_USER
                  valueFrom:
                    secretKeyRef:
                      name: {{ $root.Values.xnatUpload.xnatSecretRef }}
                      key: username
                - name: XNAT_PASS
                  valueFrom:
                    secretKeyRef:
                      name: {{ $root.Values.xnatUpload.xnatSecretRef }}
                      key: password
                # Follows the uploader. If the uploader is allowed to skip
                # verification against this XNAT, the reclaimer must be too —
                # a reclaimer that is stricter than the uploader confirms
                # nothing and keeps everything, forever, silently.
                - name: XNAT_VERIFY_SSL
                  value: {{ $root.Values.xnatUpload.verifySsl | quote }}
              # Not from values: there is no resources key for this job. It
              # shells out to aws/curl a few dozen times an hour and
              # holds one listing in memory.
              resources:
                requests: {memory: 64Mi, cpu: 50m}
                limits:   {memory: 256Mi, cpu: 500m}
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
          volumes:
            - name: scripts
              configMap:
                name: {{ include "mgmt.fullname" $root }}-reclaim-{{ $edge.name }}
                defaultMode: 0755
{{- end }}
{{- end }}
