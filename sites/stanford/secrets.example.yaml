# =============================================================================
# MANAGEMENT SITE SECRETS — PLAINTEXT TEMPLATE
# =============================================================================
# These are applied to the MANAGEMENT cluster. The edge cluster gets its own,
# much shorter, set from sites/example-edge/secrets.example.yaml — keep them
# apart. `site-secrets.sh apply` sends this whole file to whatever cluster
# KUBECONFIG points at, so a merged file would try to create edge Secrets on
# the management node and vice versa.
#
#   scripts/site-secrets.sh new <name> mgmt   # copies this to secrets.enc.yaml
#   $EDITOR sites/<name>/secrets.enc.yaml     # fill in every REPLACE_
#   scripts/site-secrets.sh encrypt <name>    # do not commit before this
#
# After encrypting, `git diff` shows which keys changed but not their values.
# Apply with `scripts/site-secrets.sh apply <name>`, which decrypts to a pipe
# and never writes plaintext to disk.
#
# THE CHARTS NEVER CONTAIN CREDENTIALS. They reference every one of these by
# Secret NAME (the xxxSecretRef / existingSecret keys in values.yaml), which is
# what lets SOPS sit on top without a single template change. If you ever find
# yourself putting a password in a values file, the design has gone wrong.
#
# THE NAMESPACE IS PART OF THE CONTRACT. A Secret is only readable by pods in
# its own namespace. Nearly everything here — SeaweedFS, Loki, Grafana,
# Alertmanager — runs in the RELEASE namespace (ais-mgmt below); only the
# uploader and reclaimer run in xnat-upload. Renaming these namespaces after the
# component they belong to reads better and is wrong: the pod starts, cannot
# find the Secret, and sits in CreateContainerConfigError with nothing to tell
# you why. scripts/ci/secret-namespaces.sh renders the chart and fails if any
# secretKeyRef cannot be satisfied, so this stays honest.
#
# If you install the release under a different name or namespace, change
# ais-mgmt below to match.
# =============================================================================
---
# SeaweedFS admin identity. Used by the bucket-creation hook.
apiVersion: v1
kind: Secret
metadata:
  name: seaweedfs-admin
  namespace: ais-mgmt
type: Opaque
stringData:
  access-key: REPLACE_S3_ADMIN_ACCESS_KEY
  secret-key: REPLACE_S3_ADMIN_SECRET_KEY
---
# Identity the management-side uploader and reclaimer use to READ and clear
# staged sessions. Deliberately separate from the admin identity above: they
# need read+delete on the staging prefix, not administrative rights over the
# whole store.
apiVersion: v1
kind: Secret
metadata:
  name: seaweedfs-upload
  namespace: xnat-upload
type: Opaque
stringData:
  access-key: REPLACE_UPLOAD_S3_ACCESS_KEY
  secret-key: REPLACE_UPLOAD_S3_SECRET_KEY
---
# THE SAME CREDENTIAL AGAIN, IN THE RELEASE NAMESPACE. This is not a mistake
# and not redundant: the two copies serve different readers.
#
#   xnat-upload (above)  the uploader and reclaimer AUTHENTICATE with it
#   ais-mgmt    (here)   SeaweedFS mounts it, with seaweedfs-admin,
#                        loki-s3-credentials and each <edge>-s3, to BUILD the
#                        s3.json identity list that authorises those keys
#
# A pod can only mount a Secret from its own namespace, and SeaweedFS runs in
# the release namespace, so the credential has to exist in both. Without this
# copy the SeaweedFS pod never leaves Init:0/1 —
# `MountVolume.SetUp failed ... secret "seaweedfs-upload" not found` — and the
# whole install stalls at step 4 with every other component healthy.
#
# KEEP THE TWO VALUES IDENTICAL. If they drift, SeaweedFS authorises one key
# while the uploader presents another, and every upload fails with S3 403.
# scripts/ci/secret-namespaces.sh enforces both the presence and the match.
apiVersion: v1
kind: Secret
metadata:
  name: seaweedfs-upload
  namespace: ais-mgmt
type: Opaque
stringData:
  access-key: REPLACE_UPLOAD_S3_ACCESS_KEY
  secret-key: REPLACE_UPLOAD_S3_SECRET_KEY
---
# The XNAT account the management uploader writes with. ONE credential for the
# whole fleet — this is the main operational advantage of upload.mode=s3 over
# giving every edge its own XNAT account, and the reason the edges hold no XNAT
# credential at all.
apiVersion: v1
kind: Secret
metadata:
  name: xnat-credentials
  namespace: xnat-upload
type: Opaque
stringData:
  server: https://xnat.example.org
  username: REPLACE_XNAT_USER
  password: REPLACE_XNAT_PASSWORD
---
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin-credentials
  namespace: ais-mgmt
type: Opaque
stringData:
  admin-user: admin
  admin-password: REPLACE_GRAFANA_PASSWORD
---
# Loki's own S3 identity for chunk storage. A separate bucket AND a separate
# identity from ingest, so a Loki compromise cannot reach staged patient data.
apiVersion: v1
kind: Secret
metadata:
  name: loki-s3-credentials
  namespace: ais-mgmt
type: Opaque
stringData:
  access-key: REPLACE_LOKI_S3_ACCESS_KEY
  secret-key: REPLACE_LOKI_S3_SECRET_KEY
---
# SMTP for Alertmanager. For Gmail this is an App Password, not the account
# password — a 2FA account rejects the account password with 535
# BadCredentials, and the only symptom is alerts that never arrive.
apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-smtp
  namespace: ais-mgmt
type: Opaque
stringData:
  username: REPLACE_SMTP_USERNAME
  password: REPLACE_SMTP_APP_PASSWORD
---
# THERE IS NO LOKI PUSH CREDENTIAL HERE, AND ADDING ONE BACK IS A REGRESSION.
#
# Each edge authenticates to the Loki push endpoint with a client certificate
# that cert-manager issues from the fleet CA, one per entry in `edges`, and
# cert-sync carries into the site. Nothing is generated by hand, nothing is
# written down twice, and it rotates on its own.
#
# What used to be here was a `loki-push-auth` Secret holding one shared password
# per edge in ingress-nginx `auth-map` form. It never authenticated a single
# push: nginx's auth_basic_user_file will not read the bare passwords this
# template shipped, so the file here and the Secret on the live cluster had
# already drifted to different bytes, every push 401'd, and the alerts that
# would have reported it are built from the logs that stopped arriving.
# docs/hardening-decisions.md §1.
#
# Each edge's S3 identity, held on the MANAGEMENT side so the SeaweedFS
# identities document can be assembled without the keys ever appearing in a
# values file or a ConfigMap.
#
# THE SAME KEY PAIR goes in that edge's own secrets file as
# `s3-edge-credentials`. They are two copies of one credential, one on each
# side; if they differ the edge cannot write to its bucket.
#
# ONE OF THESE PER EDGE, named to match that edge's `edges[].s3SecretRef`.
apiVersion: v1
kind: Secret
metadata:
  name: edge-rsl60-s3
  namespace: ais-mgmt
type: Opaque
stringData:
  access-key: REPLACE_EDGE_S3_ACCESS_KEY
  secret-key: REPLACE_EDGE_S3_SECRET_KEY

---
# Long-lived XNAT credentials used only to issue alias tokens.
apiVersion: v1
kind: Secret
metadata:
  name: xnat-token-source
  namespace: xnat-upload
type: Opaque
stringData:
  server: REPLACE_XNAT_URL
  username: REPLACE_XNAT_USER
  password: REPLACE_XNAT_PASSWORD
