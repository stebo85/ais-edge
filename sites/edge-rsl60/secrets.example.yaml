# Copy to secrets.enc.yaml, fill, then encrypt with scripts/site-secrets.sh.
# S3 credentials and ca-bundle are delivered from the management cluster.
apiVersion: v1
kind: Secret
metadata:
  name: orthanc-credentials
  namespace: xnat-ingest
type: Opaque
stringData:
  orthanc-user: REPLACE_ORTHANC_USER
  orthanc-password: REPLACE_ORTHANC_PASSWORD
